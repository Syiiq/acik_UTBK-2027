meter, \npanjang AD = … meter \n(A) 5 \n(B) 6 \n(C) 7 \n(D) 8 \n(E) 9 \n \n02. Sebuah jembatan memiliki bentuk trapesium \nABCD dengan AB∥CD, panjang AB=14 m \ndan CD=8 m. Tinggi trapesium adalah 6 m. \nDiagonal AC dan BD berpotongan di titik P. \nPerbandingan luas segitiga APB dan CPD \nadalah … \nA. 1:1 \nB. 7:4 \nC. 2:1 \nD. 14:8 \nE. 49:16 \n \n03. Pada jembatan berbentuk trapesium ABCD \ndengan AB∥CD, diketahui AB=12 m dan \nCD=6 m. Diagonal AC dan BD berpotongan \ndi titik P. Perbandingan panjang AP:PC \nadalah … \n(A) 1 : 1 \n(B) 2 : 1 \n(C) 3 : 1 \n(D) 1 : 2 \n(E) 1 : 3 \n \n04. Sebuah kabel dipasang dari titik A ke titik C \n(diagonal \nAC) \npada \njembatan \nberbentuk \ntrapesium dengan tinggi 4 m, AB=12 m dan CD=6 \nm. Jika titik D dan C berada tepat di tengah secara \nhorizontal terhadap A dan B, maka panjang \nminimum kabel AC adalah … \n(A) √100 \n(B) √116 \n(C) √136 \n(D) √160 \n(E) √180 \n \nTEKS 2 \n \nDalam \nrangka \nmeningkatkan \nefektivitas \npengelolaan \nlingkungan, \ntelah \ndilakukan \npendataan terhadap jumlah sampah yang \ndihasilkan selama satu minggu pada suatu \ndaerah. Setiap jenis sampah dan metode \npengelolaannya dikelompokkan dalam lima \nkategori seperti tampak pada diagram berikut. \nJumlah sampah yang dihasilkan masyarakat \ndaerah tersebut pada bulan September 2024 \nadalah 120 ton. Setiap jenis sampah diasumsikan \nhanya masuk ke salah satu kategori pengelolaan. \n\n05. Jika 2/5 sampah kaca, logam, dan kertas didaur \nulang, jumlah sampah daur ulang yang berasal \ndari sampah plastik dan organik adalah … ton. \n(A) 14 \n(B) 15 \n(C) 27 \n(D) 34 \n(E) 48 \n \n06. Jika seluruh sampah yang dibuang ke TPA \nberasal dari sampah organik dan plastik saja, \nmaka perbandingan massa sampah organik \nterhadap plastik yang masuk ke TPA adalah … \n(A) 1 : 1 \n(B) 2 : 1 \n(C) 3 : 2 \n(D) 4 : 1 \n(E) 5 : 2 \n\nBELAJAR SESUAI CARA KERJA OTAK","passage":"","images":["assets/questions/pdf_3_000.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0206","kind":"halaman","subject":"PM","source":"TAMBAHAN PM H-1 For Day 2.pdf","page":2,"title":"TAMBAHAN PM H-1 For Day 2 · Halaman 2","text":"07. Diketahui total sampah adalah 120 ton. Jika \n50% dari sampah plastik dibakar dan sisanya \ndigunakan kembali, maka jumlah sampah \nplastik yang digunakan kembali adalah … \nton. \n(A) 6 \n(B) 8 \n(C) 10 \n(D) 12 \n(E) 15 \n \n08. Jika seluruh sampah yang dikomposkan \nberasal dari sampah organik, berapakah \npersentase sampah organik yang tidak \ndikomposkan? \n(A) 50% \n(B) 60% \n(C) 75% \n(D) 80% \n(E) 90% \n \nTEKS 3 \n \nFemi mulai berlatih untuk mengikuti lomba \nlari lintas alam sejauh 8 km dengan berlari \nsetiap \npekan \nselama \n28 \npekan. \nFemi \nmengawali latihan dengan berlari sejauh 2,3 \nkm pada pekan pertama. Setiap pekan \nsetelah itu dia berlari 250m lebih jauh dari \npekan \nsebelumnya \nsampai \ndia \nberlari \nmelampaui jarak sesungguhnya untuk dapat \nmenyelesaikan parjang lintasan lari lintas \nalam. \nSetiap \npekan \nsetelah \nitu \ndia \nmenyelesaikan lintasan tanpa menambah \njarak. \n \n09. Jika ℓn menyatakan panjang lintasan yang \nditempuh Femi pada pekan ke n, ℓn = . . . \n(A) 0,25n + 2, 05, n = 1, 2, . . . , 28 \n(B) 0,25n + 2, 05, n = 1, 2, . . . , 24 \n(C) 0,25n + 2, 3n = 0, 1, 2, . . . , 28 \n(D) 0,2n + 2, 3, n = 0, 1, 2, . . . , 24 \n(E) 0,2n + 2, 1, n = 1, 2, . . . , 28 \n \n10. Pilihlah jawaban pada kolom di sebelah \nkanan pernyataan yang sesuai dengan \njawaban. \n\nPernyataan \nBenar \n(B) \nSalah \n(S) \nJarak \nterjauh \nyang \nditempuh Femi dalam sesi \nlatihan \nsebelum \nperlombaan \nadalah 8, 05m \n\nFemi tidak lagi menambah \njarak latihannya setelah \npekan ke 23 \n\nJumlah jarak yang telah \nditempuh \nFemi \ndalam \nlatihan sampai pekan \nke 7 adalah 20, 5 km \n\n11. Jika pada pekan ke 10, ke 13, dan ke 17 Femi tidak \ndapat melakukan latihan, jumlah jarak yang Femi \ntempuh sampai pekan ke 18 adalah . . . km. \n(A) 51,90  \n(B) 57,20  \n(C) 58,20  \n(D) 63,50 \n(E) 79,65 \n \n12. Jika kalori yang terbakar pada tubuh Femi sebesar \n60 kalori ketika dia berlari sejauh 1 km, jumlah \nkalori yang telah terbakar selama 28 pekan latihan \nyang telah dilakukan Femi adalah . . . kalori. \n(A) 7.452  \n(B) 8.901  \n(C) 9.261 \n(D) 9.384 \n(E) 9.534 \n \nTEKS 4 \n \nDi suatu toko bangunan harga jual 2 kaleng cat \nkayu, 3 kaleng cat tembok, dan 1 kaleng cat besi \nadalah Rp318.000,00, sementara harga jual 1 \nkaleng cat kayu dan 2 kaleng cat besi adalah \nRp102.000,00. \n \n13. Jika Pak Tono membeli 1 kaleng cat kayu, 1 kaleng \ncat tembok, dan 1 kaleng cat besi di toko tersebut, \nia harus membayar sebanyak …. \n(A) Rp128.000,00 \n(B) Rp132.000,00 \n(C) Rp136.000,00 \n(D) Rp140.000,00 \n(E) Rp144.000,00","passage":"","images":["assets/questions/pdf_3_001.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0207","kind":"halaman","subject":"PM","source":"TAMBAHAN PM H-1 For Day 2.pdf","page":3,"title":"TAMBAHAN PM H-1 For Day 2 · Halaman 3","text":"14. Selisih harga 1 kaleng cat tembok dengan 1 \nkaleng cat besi adalah …. \n(A) Rp40.000,00 \n(B) Rp38.000,00 \n(C) Rp36.000,00 \n(D) Rp34.000,00 \n(E) Rp32.000,00 \n \n15. Jika Pak Kirman membeli 5 kaleng cat kayu, \n4 kaleng cat tembok, dan 4 kaleng cat besi di \ntoko tersebut, ia harus membayar sebanyak \n…. \n(A) Rp620.000,00 \n(B) Rp622.000,00 \n(C) Rp634.000,00 \n(D) Rp738.000,00 \n(E) Rp836.000,00 \n \n16. Jika harga cat naik, kenaikan harga cat kayu \nper kaleng adalah ½ kali kenaikan harga cat \ntembok per kaleng. Harga cat besi tidak \nmengalami kenaikan. Jika selisih harga cat \ntembok dan cat besi per kaleng sekarang \nRp48.000,00, maka kenaikan harga cat \ntembok per kaleng adalah …. \n(A) Rp8.000,00 \n(B) Rp9.000,00 \n(C) Rp10.000,00 \n(D) Rp11.000,00 \n(E) Rp12.000,00 \n \nTEKS 5 \n \nPada suatu toko ponsel, harga resmi ponsel \nmerek X adalah Rp10.000.000,00 dan toko \nmemberi diskon 20%. Ponsel tersebut juga \ndapat dibeli dengan angsuran setiap bulan \n(besar sama, mulai bulan kedua), dikenakan \nBunga Tunggal 6% per tahun, dan uang muka \nminimal 10% dari harga resmi. Toko juga \nmenjual antigores dengan harga Rp150.000,00 \ndan casing ponsel dengan harga Rp90.000,00. \n \n17. Pak Budi ingin membeli ponsel X dengan \nmengangsur. \nIa \njuga \ningin \nmembeli \nantigores, casing, dan nomor perdana beserta \npulsanya. \nJika \nia \nmembawa \nuang \nRp1.500.000,00, uang yang dapat digunakan \nuntuk membeli nomor perdana beserta \npulsanya maksimal adalah … ribu rupiah. \n(A) 240 \n(B) 250 \n(C) 260 \n(D) 270 \n(E) 280 \n \n18. Jika Pak Budi membeli ponsel dengan uang muka \nminimal dan mengangsur sebanyak 20 kali \nangsuran yang dibayarkan adalah … ribu rupiah. \n(A) 350 \n(B) 385 \n(C) 405 \n(D) 425 \n(E) 495 \n \n19. Bu Ati ingin membeli ponsel X dengan uang \nmuka minimal dan mengangsur setiap bulan \nRp400.000,00, kecuali angsuran bulan terakhir \nyang \nmungkin \nkurang \ndari \nangsuran \nsebelumnya. Jika ia hanya mampu membayar \npokok utangnya (tanpa bunga), Bu Ati ingin \nmengangsur sebanyak … kali. \n(A) 23 \n(B) 22 \n(C) 21 \n(D) 20 \n(E) 19 \n \n20. Untuk \nmeningkatkan \npenjualan, \ntoko \nmenawarkan \npembelian \nponsel \nX \ndengan \nmengangsur tanpa uang muka dengan angsuran \ndalam peralatan tertentu, kedua harga tetap, dan \nseterusnya \nberturut-turut \nRp1.400.000,00, \nRp1.300.000,00, Rp1.200.000,00, Rp1.100.000,00, \ndan seterusnya hingga nol rupiah. Harga ponsel \nX dengan cara pembelian tersebut dibandingkan \ndengan harga resmi menjadi … \n(A) lebih mahal Rp100.000,00 \n(B) lebih mahal Rp200.000,00 \n(C) lebih mahal Rp400.000,00 \n(D) lebih mahal Rp300.000,00 \n(E) lebih mahal Rp500.000,00","passage":"","images":["assets/questions/pdf_3_002.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0208","kind":"slide","subject":"PK","source":"FR DAY 4 UTBK 2026.pptx","page":2,"title":"FR DAY 4 UTBK 2026 · Slide 2","text":"","passage":"","images":["assets/questions/present_4_001_0.webp"],"op o, televisi tidak bisa diperbaiki karena Jono tidak bisa melakukannya sendiri. Selain itu, anaknya sedang mengerjakan tugas sekolah sehingga tidak bisa membantu. Jika rencana Jono berjalan lancar, Kesimpulan yang PALING TEPAT adalah … \nA. Anak Jono tidak bisa membantu dan teknisi menepati janjinya. \nB. Teknisi membatalkan janjinya dan televisi Jono tidak bisa diperbaikı. \nC. Televisi Jono tidak bisa diperbaiki dan anak Jono tidak bisa membantu \nD. Anak Jono bisa membantu Jono untuk memperbaiki televisi di rumahnya \nE. Televisi Jono berhasil diperbaiki meskipun teknisi membatalkan janjinya","passage":"","images":[],"options":["Anak Jono tidak bisa membantu dan teknisi menepati janjinya. ","Teknisi membatalkan janjinya dan televisi Jono tidak bisa diperbaikı. ","Televisi Jono tidak bisa diperbaiki dan anak Jono tidak bisa membantu ","Anak Jono bisa membantu Jono untuk memperbaiki televisi di rumahnya ","Televisi Jono berhasil diperbaiki meskipun teknisi membatalkan janjinya"],"answer":null,"explanation":""},{"id":"q0230","kind":"slide","subject":"PU","source":"FR DAY 3 UTBK 2026.pptx","page":4,"title":"FR DAY 3 UTBK 2026 · Slide 4","text":"3) Setiap menyelesaikan tugas bersama tim, Adi dan Dito memiliki tugas masing-masing, Biasanya, jika Adi memimpin diskusi atau mengungkapkan idenya dalam kelompok, Dito mencatat semua hasil diskusi secara detail agar semuanya tersimpan dengan baik. Sementara itu, Budi mencari bahan referensi dan membagi beban kerja agar anggota tim merasa nyaman dalam mengerjakan tugas. Jika saat ini Adi diskusi atau mengungkapkan idenya, kesimpulan yang PALING TEPAT Adalah … \nDito tidak mencatat semua hasil diskusi secara detail dan Budi tidak mencari bahan referensi \nBudi akan membagi beban kerja dan Dito akan mencatat semua hasil diskusi secara detail. \nJika Budi mencari bahan referensi, Dito akan mencatat semus hasil diskusi secara detail \nAdi tidak memimpin diskusi dan tıdak mengungkapkan idenya di dalam kelompok. \nBudi mencari bahan referensi, sedangkan Dito akan mencatat semua hasil diskusı secara detail.","passage":"","images":[],"options":[],"answer":null,"explanation":""},{"id":"q0231","kind":"slide","subject":"PU","source":"FR DAY 3 UTBK 2026.pptx","page":5,"title":"FR DAY 3 UTBK 2026 · Slide 5","text":"4) Bel pulang sekolah sudah berbunyi sejak tadi. Jemputan Iwan hari ini terlambat. Iwan tidak bisa pulang tepat waktu hari ini dan harus menunggu meskipun ada kemungkinan jemputannya tidak datang terlambat. Selain itu, Iwan juga belum menelepon orang tua jemputannya untuk memberi kabar mengenai keterlambatan ini. Dalam situasi tersebut, apa simpulan yang PALING TEPAT mengenal kandisi Iwan? \nIwan sudah menelepon orang tua jemputannya dan ia bisa pulang tepat waktu hari ini. \nIwan belum menelepon orang tua jemputannya dan ia tidak bisa pulang tepat waktu hari ini. \nJemputan Iwan tidak datang terlambat dan la belum menelepon orang tua. \nIwan sudah menelepon orang tua jemputannya dan ia tidak bisa pulang tepat waktu hari ini. \nJemputan Iwan tidak jadi datang terlambat dan ia bisa pulang tepat waktu hari ini.","passage":"","images":[],"options":[],"answer":null,"explanation":""},{"id":"q0232","kind":"slide","subject":"PU","source":"FR DAY 3 UTBK 2026.pptx","page":6,"title":"FR DAY 3 UTBK 2026 · Slide 6","text":"5) Keluarga iwan akan menggunakan dua jenis transportasi untuk liburan tahun ini. Dua jenis tersebut adalah kereta api untuk perjalanan antarkota dan mobil untuk perjalanan dalam kota. Penggunaan transportasi tersebut juga bergantung pada kondisi nenek lwan. Jika nenek Iwan ikut berlibur, mereka akan menggunakan pesawat. Jika keluarga Iwan tidak jadi naik kereta dan mobil saat liburan, pernyataan di bawah iniyang PALING TEPAT adalah … \nA. Keluarga Iwan tidak jadi naik kereta api dan menggunakan mobil. \nB. Jika nenek ikut berlibur, mereka akan menggunakan pesawat. \nC. Keluarga Iwan tidak naik kereta api dan menggunakan mobil. \nD. Nenek tidak ikut berlibur dan keluarga Iwan menggunakan mobil. \nE. Jika keluarga lwan naik kereta api, nenek tidak ikut berlibur.","passage":"","images":[],"options":["Keluarga Iwan tidak jadi naik kereta api dan menggunakan mobil. ","Jika nenek ikut berlibur, mereka akan menggunakan pesawat. ","Keluarga Iwan tidak naik kereta api dan menggunakan mobil. ","Nenek tidak ikut berlibur dan keluarga Iwan menggunakan mobil. ","Jika keluarga lwan naik kereta api, nenek tidak ikut berlibur."],"answer":null,"explanation":""},{"id":"q0233","kind":"slide","subject":"PU","source":"FR DAY 3 UTBK 2026.pptx","page":7,"title":"FR DAY 3 UTBK 2026 · Slide 7","text":"6).  Ami dan Dea biasanya membantu orang tuanya dengan berbagi tugas. Pada pagi hari, Ami mengepel lantai agar seluruh rumah bersih, sedangkan Dea akan membantu kegiatan di dapur agar sarapan pagi segera siap. Mereka sepakat bahwa setidaknya salah satu darı mereka akan melaksanakan pekerjaan rumah tersebut. Selain itu, mereka juga memiliki saudara laki-laki yang siap membantu mereka. Jika Ami tidak mengepel lantai. Ali akan membantu menyapu semua ruangan. Begitu pula, jika Dea tidak membantu kegiatan di dapur, Didi akan mencuci peralatan dapur. Jika diketahui bahwa salah satu dari mereka tidak melaksanakan tugasnya, apa akibat logis yang PALING TEPAT? \nA. Jika membantu kegiatan di dapur, Didi akan mencuci peralatan dapur. \nB. Ali menyapu lantai semua ruangan atau Didi mencuci peralatan dapur \nC. Ami tidak mengepel lantai dan Dea tidak membantu kegiatan di dapur. \nD. Ali tidak menyapu lantai semua ruangan dan Didi tidak mencuci peralatan dapur. \nE. Jika Ami mengepel lantai, Dea tidak membantu kegiatan di dapur.","passage":"","images":[],"options":["Jika membantu kegiatan di dapur, Didi akan mencuci peralatan dapur. ","Ali menyapu lantai semua ruangan atau Didi mencuci peralatan dapur ","Ami tidak mengepel lantai dan Dea tidak membantu kegiatan di dapur. ","Ali tidak menyapu lantai semua ruangan dan Didi tidak mencuci peralatan dapur. ","Jika Ami mengepel lantai, Dea tidak membantu kegiatan di dapur."],"answer":null,"explanation":""},{"id":"q0234","kind":"slide","subject":"PU","source":"FR DAY 3 UTBK 2026.pptx","page":8,"title":"FR DAY 3 UTBK 2026 · Slide 8","text":"7) Iwan menanam pohon mangga di halaman rumahnya. Di dalam buku panduan penanaman pohon mangga, disebutkan jika ia memberi pupuk kompos secara teratur dan menyiram pohon mangga setiap hari pohon tersebut akan tumbuh dengan subur. Kesuburan pohon mangga adalah kunci keberhasilan pembuahan. Buku panduan itu juga menuliskan bahwa jika tumbuh dengan subur, pohon mangga akan menghasilkan banyak buah. Berdasarkan pernyataan di atas, kesimpulan yang PALING TEPAT adalah … \nJika Iwan memberi pupuk secara teratur dan menyiram pohon mangga setiap hari, pohon tersebut akan menghasilkan banyak buah. \nJika pohon mangga menghasilkan banyak buah, pohon tersebut tumbuh dengan subur di halaman rumahnya. \nIwan memberi pupuk kompos secara teratur dan rajin menyiram pohon mangganya setiap hari. \nJika pohon mangga tumbuh dengan subur di halaman rumahnya, lwan memberi pupuk secara teratur dan menyiramnya. \nIwan tidak memberi pupuk secara teratur dan tidak menyiram pohon mangga setiap hari sehingga pohon tersebut tidak tumbuh dengan subur.","passage":"","images":[],"options":[],"answer":null,"explanation":""},{"id":"q0235","kind":"slide","subject":"PU","source":"FR DAY 3 UTBK 2026.pptx","page":9,"title":"FR DAY 3 UTBK 2026 · Slide 9","text":"8) Pemerintah Daerah X meluncurkan program Sekolah Inovatif yang bertujuan untuk meningkatkan kualitas pembelajaran berbasis teknologi di seluruh daerah. Pemerintah berjanji, jika sekolah-sekolah di daerah berhasil menyusun kurikulum inovatif sesuai standar nasional, sekolah-sekolah tersebut akan mendapatkan pelatihan guru atau bantuan perangkat digital. Pertanyaan tersebut menunjukkan bahwa penyusunan kurikulum inovatif merupakan indikator utama komitmen sekolah terhadap pembaruan Pendidikan. Selain itu pemerintah juga menyatakan jika sekolah sudah mendapatkan pelatihan guru atau bantuan perangkat digital, sekolah tersebut akan dikategorikan sebagai sekolah maju sehingga sekolah tersebut berpeluang menjadi sekolah percontohan dalam penerapan teknologi dan inovasi Pendidikan di daerahnya. Berdasarkan pernyataan Pemerintah Daerah X, apa kesimpulan yang PALING TEPAT? \nSekolah bisa menjadi percontohan meskipun tidak pernah mendapat pelatihan guru atau bantuan perangkat digital. \nSekolah yang gurunya tidak mendapatkan pelatihan tidak bisa dikategorikan ke dalam sekolahı maju. \nJika sekolah menggunakan perangkat digital, sekolah tersebut berhasil menyusun kurikulum inovatif. \nJika berhasil menyusun kurikulum inovatif sesuai standar nasional, sekolah tersebut dikelompokkan sebagai sekolah maju. \nSekolah yang bukan sekolah maju tidak menjalankan program pembelajaran berbasis teknologi","passage":"","images":[],"options":[],"answer":null,"explanation":""},{"id":"q0236","kind":"slide","subject":"PU","source":"FR DAY 3 UTBK 2026.pptx","page":10,"title":"FR DAY 3 UTBK 2026 · Slide 10","text":"9) Tim barista dari Kafe X mengikuti lomba tahunan untuk menentukan kopi dengan rasa dan aroma terbaik. Mereka bisa menang berdasarkan dua hal. Pertama, jika mereka menggunakan biji kopi premium, rasa akan enak. Kedua, jika mesin kopi bekerja dengan baik, aroma kopi akan kuat. Berdasarkan pengalaman dari lomba-lomba sebelumnya, jika rasa kopi enak atau aromanya kuat, juri akan memberikan tanda tangan dengan memberikan tepuk tangan. Pada saat itu, setelah lomba berakhir, juri tidak memberikan tepuk tangan. Berdasarkan informasi di atas, kesimpulan yang PALING TEPAT adalah … \nA. Biji kopi premium digunakan dan mesin kopi bekerja dengan baik. \nB. Biji kopi bukan premium atau mesin kopi tidak bekerja dengan baik. \nC. Rasa kopi premiumnya enak, tetapi aromanya tidak terlalu kuat. \nD. Biji kopinya premium, tetapi rasanya tidak enak dan aromanya tidak kuat. \nE. Bip kopi bukan premium, tetapi mesin kopi bekerja dengan baik","passage":"","images":[],"options":["Biji kopi premium digunakan dan mesin kopi bekerja dengan baik. ","Biji kopi bukan premium atau mesin kopi tidak bekerja dengan baik. ","Rasa kopi premiumnya enak, tetapi aromanya tidak terlalu kuat. ","Biji kopinya premium, tetapi rasanya tidak enak dan aromanya tidak kuat. ","Bip kopi bukan premium, tetapi mesin kopi bekerja dengan baik"],"answer":null,"explanation":""},{"id":"q0237","kind":"slide","subject":"PU","source":"FR DAY 3 UTBK 2026.pptx","page":11,"title":"FR DAY 3 UTBK 2026 · Slide 11","text":"10) Dalam kegiatan praktikum biologi, Kelompok A ditugaskan untuk meneliti struktur daun, sedangkan Kelompok B meneliti jenis mikroorganisme di air. Guru menyampaikan aturan, yaitu jika Kelompok A berhasil menyusun laporan penelitian tentang struktur daun, mereka harus melakukan uji lanjutan di laboratorium. Sementara itu, jika Kelompok B berhasil mengamati mikroorganisme dengan tepat, mereka diperbolehkan melakukan presentasi hasil minggu depan. Guru menambahkan bahwa jika salah satu dari kedua kelompok berhasil menyelesaikan tugas awalnya, siswa kelas Biologi tersebut akan diundang untuk mengikuti kompetisi penelitian sekolah. Setelah menjadi peserta kompetisi, paling tidak, salah satu kegiatan lanjutan akan terjadi, yaitu Kelompok A melakukan uji lanjutan atau Kelompok B mempresentasikan hasil minggu depan. Ternyata salah satu dari kedua kelompok berhasil menyelesaikan tugas awalnya. Berdasarkan keadaan tersebut, manakah kesimpulan yang PALING TEPAT? \nA. Kelompok A melakukan uji lanjutan atau Kelompok 8 boleh mempresentasikan hasilnya. \nB. Kelompok A atau Kelompok B tidak berhasil mengikuti kompetisi penelitian. \nC. Kelompok A wajib melakukan uji lanjutan karena mereka telah menyusun laporan. \nD. Kelompok B mempresentasikan hasilnya karena mereka berhasil melakukan pengamatan. \nE. Kegiatan praktikum biologi diadakan untuk kelas Biologi yang dipersiapkan untuk mengikuti kompetisi.","passage":"","images":[],"options":["Kelompok A melakukan uji lanjutan atau Kelompok 8 boleh mempresentasikan hasilnya. ","Kelompok A atau Kelompok B tidak berhasil mengikuti kompetisi penelitian. ","Kelompok A wajib melakukan uji lanjutan karena mereka telah menyusun laporan. ","Kelompok B mempresentasikan hasilnya karena mereka berhasil melakukan pengamatan. ","Kegiatan praktikum biologi diadakan untuk kelas Biologi yang dipersiapkan untuk mengikuti kompetisi."],"answer":null,"explanation":""},{"id":"q0238","kind":"slide","subject":"PU","source":"FR DAY 3 UTBK 2026.pptx","page":12,"title":"FR DAY 3 UTBK 2026 · Slide 12","text":"11) Rumah joglo memiliki nilai sejarah yang tinggi. Sebagian rumah di perdesaan di daerah terpencil tidak bernilai sejarah. Sementara itu, di pedesaan di daerah terpencil terdapat berbagai jenis rumah minimalis. Berdasarkan pernyataan di atas, manakah simpulan yang PALING TEPAT? \nA. Semua rumah di perdesaan di daerah terpencil adalah rumah joglo. \nB. Sebagian rumah di perdesaan di daerah terpencil bukan rumah joglo. \nC. Semua rumah di perdesaan di daerah terpencil memiliki nilai budaya yang kental. \nD. Sebagian rumah di perdesaan di daerah terpencil tidak memiliki nilai sejarah yang tinggi. \nE. Semua rumah di perdesaan di daerah terpencil tidak memiliki nilai sejarah yang tinggi","passage":"","images":[],"options":["Semua rumah di perdesaan di daerah terpencil adalah rumah joglo. ","Sebagian rumah di perdesaan di daerah terpencil bukan rumah joglo. ","Semua rumah di perdesaan di daerah terpencil memiliki nilai budaya yang kental. ","Sebagian rumah di perdesaan di daerah terpencil tidak memiliki nilai sejarah yang tinggi. ","Semua rumah di perdesaan di daerah terpencil tidak memiliki nilai sejarah yang tinggi"],"answer":null,"explanation":""},{"id":"q0239","kind":"slide","subject":"PU","source":"FR DAY 3 UTBK 2026.pptx","page":13,"title":"FR DAY 3 UTBK 2026 · Slide 13","text":"12). Pada akhir latihan fisik intensif, sebagian peserta Pelatihan X mengalami penurunan ketahanan fisik. Hal ini terjadi ketika panitia tidak memberikan kesempatan istirahat yang cukup. Penurunan ketahanan fisik juga terjadi ketika panitia menjadwalkan kegiatan olahraga secara rutin. Berdasarkan pernyataan di atas, manakah simpulan berikut yang PALING TEPAT ? \nPenjadwalan kegiatan olahraga rutin pada awal kegiatan akan menurunkan ketahanan fisik. \nPada akhir sesi latihan fisik intensif peserta terbiasa mengalami penurunan ketahanan fisik. \nPemberian kesempatan istirahat dan penjadwalan olahraga rutin memiliki dampak yang sama. \nPada awal sesi latihan fisik intensif peserta banyak yang tidak mengalami penurunan ketahanan fisik. \nPenurunan ketahanan fisik menyebabkan panitia menjadwalkan olahraga secara rutin.","passage":"","images":[],"options":[],"answer":null,"explanation":""},{"id":"q0240","kind":"slide","subject":"PU","source":"FR DAY 3 UTBK 2026.pptx","page":14,"title":"FR DAY 3 UTBK 2026 · Slide 14","text":"13) Kehangatan interpersonal seseorang meningkatkan kepuasannya dalam melakukan hubungan pertemanan. Kepuasan tersebut tecermin melalui sikap saling menghargai. Di sisi lain, tingkat kepercayaan antar teman mempengaruhi kuatnya pengaruh kehangatan interpersonal terhadap kepuasan hubungan antarteman. Manakah dari pernyataan berikut yang PALING TEPAT? \nSeseorang dengan kehangatan interpersonal tinggi tetap merasa puas dalam pertemanan meskipun tingkat kepercayaannya kepada teman rendah. \nKepuasan dalam pertemanan dapat meningkatkan kehangatan interpersonal ketika tingkat kepercayaan antarteman tinggi. \n Kekuatan hubungan kehangatan interpersonal terhadap kepuasan pertemanan bergantung pada tingkat kepercayaan antarteman. \nKepercayaan antarteman hanya memengaruhi sikap saling menghargai, tetapi tidak memengaruhi kehangatan interpersonal. \nSeseorang yang menunjukkan sikap saling menghargai merasa puas dalam pertemanan meskipun kurang mendapat kepercayaan dari teman","passage":"","images":[],"options":[],"answer":null,"explanation":""},{"id":"q0241","kind":"slide","subject":"PU","source":"FR DAY 3 UTBK 2026.pptx","page":15,"title":"FR DAY 3 UTBK 2026 · Slide 15","text":"14).  Menurut X, kemandirian adalah kemampuan untuk membuat keputusan penting dalam hidupnya dan menanggung konsekuensinya tanpa melibatkan pihak lain. Menurut Y, kemandirian adalah kondisi di mana seseorang telah mampu memenuhi kebutuhan dasarnya melalui usahanya sendiri tanpa bergantung pada bantuan orang lain. Apa kesamaan mendasar antara pendapat X dan Y mengenai konsep kemandirian ? \nKemandirian dapat dicapai setelah seseorang berani mengambil sebuah keputusan. \nKemandirian terutama terkait dengan kemampuan finansial dan ekonomi seseorang \nKemandirian adalah optimalisasi kapasitas pribadi dengan meminimalisir dukungan eksternal \nKemandirian adalah sebuah proses untuk membebaskan diri dari pertolongan pihak lain. \nKemandirian mendorong seseorang dapat merealisasikan apa yang dicita-citakannya.","passage":"","images":[],"options":[],"answer":null,"explanation":""},{"id":"q0242","kind":"slide","subject":"PU","source":"FR DAY 3 UTBK 2026.pptx","page":16,"title":"FR DAY 3 UTBK 2026 · Slide 16","text":"15) Kerja sama adalah kesediaan individu untuk berkontribusi dan berkoordinasidengan orang lain gunamencapai rujuan Bersama secara efektif. Manakah dari pernyataan berikut yang PALING TEPAT dengan definisi kerja sama?  \nDalam penyelesaian proyek, Adi menyesuaikan cara kerjanya agar selaras dengan rekan lain untuk mendapatkan hasil sesuai target. \nDalam rapat, Rina menyampaikan pendapatnya secara rinci dan berfokus pada hasil pribadi yang ingin dicapai. \nDalam diskusi kelompok, Sinta mendengarkan pendapat anggota dan memberikan apresiasi serta mengikuti keputusan kelompok. \nDalam proyek kelompok, Deni harus menunjukkan kemampuan terbaiknya tanpa banyak menyesuaikan diri dengan kerja tim. \n Ketika rekannya kesulitan, Lia memberikan semangat agar tetap percaya diri untuk menyelesaikan tugas hingga akhir.","passage":"","images":[],"options":[],"answer":null,"explanation":""},{"id":"q0243","kind":"slide","subject":"PU","source":"FR DAY 3 UTBK 2026.pptx","page":17,"title":"FR DAY 3 UTBK 2026 · Slide 17","text":"16). Penelitian menunjukkan bahwa peningkatan motivasi pekerja dipengaruhi oleh kualitas atasan dalam mengarahkan bawahan. Oleh karena itu, sebuah perusahaan mengadakan program pendampingan bagi para manajer. Dalam periode yang sama, Jumlah ide perbaikan yang diajukan karyawan perusahaan tersebut meningkat tajam. Berdasarkan informasi di atas, manakah yang paling mungkin terjadi terkait meningkatnya jumlah ide perbaikan pada karyawan? Apa Tindakan yang paling tepat terkai masalah tersebut? \nAtasan turut Menyusun peraturan yang membebaskan pekerja dalam berekspresi. \n Perusahaan mendukung pendanaan maksimal untuk pelatihan bagi semua pegawainya. \nPerusahaan memusatkan diri pada pengembangan kompetensi kepemimpinan para atasan. \nPengelolaan perusahaan melakukan proses perekrutan yang trasnparan\nPerusahaan memberikan peringatan kepada pekerja agar bekerja lebih giat.","passage":"","images":[],"options":[],"answer":null,"explanation":""},{"id":"q0244","kind":"slide","subject":"PU","source":"FR DAY 3 UTBK 2026.pptx","page":18,"title":"FR DAY 3 UTBK 2026 · Slide 18","text":"17)Sebuah organisasi meluncurkan program beasiswa Pendidikan untuk anak-anak dari keluarga tidak mampu guna mengurangi kesenjangan pada akses Pendidikan yang lebih baik. Pada awal peluncuran program tersebut disambut hangat oleh masyarakat dengan jumlah pendaftar yang tinggi. Namun, beberapa bulan kemudian jumlah pendaftar mulai menurun drastic meskipun organisasi terus melakukan promosi aktif. Manakah pernyataan yang PALING TEPAT yang menjelaskan fenomena penurunan pendaftar ini? \nProgram ini menyebabkan peningkatan biaya hidup keluarga penerima beasiswa karena berfokus pada Pendidikan formal. \nPemerintah memberikan subsidi bantuan Pendidikan ke sekolah-sekolah lain di daerah tersebut. \nPendaftar yang sebelumnya terdaftar memiliki keterbatasan akademik sehingga tidak dapat mengikuti program. \nOrganisasi nirlaba tersebut memberikan kualifikasi dan prasyarat berupa nilai rapor pada mata pelajaran inti. \nPada awalnya, masyarakat mengira bahwa program ini akan memberikan beasiswa penuh tanpa syarat tambahan.","passage":"","images":[],"options":[],"answer":null,"explanation":""},{"id":"q0245","kind":"slide","subject":"PU","source":"FR DAY 3 UTBK 2026.pptx","page":19,"title":"FR DAY 3 UTBK 2026 · Slide 19","text":"18) Beberapa siswa yang jarang hadir rapat menyelesaikan tugas tepat waktu. Sebagian siswa yang sering hadir rapat menyelesaikan tugas tidak tepat waktu. Berdasarkan pengamatan tersebut, manakah kesimpulan yang PALING TEPAT? \nA. Siswa yang sering hadir rapat tidak menyelesaikan tugas tepat waktu. \nB. Siswa yang jarang hadir rapat wajib menyelesaikan tugas dengan konsisten. \nC. Siswa yang jarang hadir rapat tidak memahami pentingnya masalah ketepatan waktu. \nD. Tidak ada hubungan antara kehadiran rapat dengan konsistensi dalam menyelesaikan tugas. \nE. Siswa yang sering hadir rapat juga konsisten menyelesaikan tugas.","passage":"","images":[],"options":["Siswa yang sering hadir rapat tidak menyelesaikan tugas tepat waktu. ","Siswa yang jarang hadir rapat wajib menyelesaikan tugas dengan konsisten. ","Siswa yang jarang hadir rapat tidak memahami pentingnya masalah ketepatan waktu. ","Tidak ada hubungan antara kehadiran rapat dengan konsistensi dalam menyelesaikan tugas. ","Siswa yang sering hadir rapat juga konsisten menyelesaikan tugas."],"answer":null,"explanation":""},{"id":"q0246","kind":"slide","subject":"PU","source":"FR DAY 3 UTBK 2026.pptx","page":20,"title":"FR DAY 3 UTBK 2026 · Slide 20","text":"19) Seorang peneliti mengadakan program “Pintar Bersama” yang bertujuan agar frekuensi berbagi pengetahuan kepada temannya meningkat. Setelah program selesai, kelompok yang mengikuti program tersebut lebih sering berbagi pengetahuan dibandingkan kelompok murid yang tidak mengikuti. Peneliti menyimpulkan bahwa program tersebut menyebabkan peningkatan pengetahuan murid. Informasi yang perlu ditambahkan agar kesimpulan tersebut TEPAT adalah … \nData demografi yang lengkap mengenai kelompok murid yang mengikuti program dan yang tidak mengikuti program. \nRincian mengenai ruang lingkup materi program apakah hanya sesuai untuk murid pada kelompok tertentu atau tidak. \n Motivasi siswa Ketika mengikuti program apakah dari kemauannya sendiri atau karena kewajiban dari sekolah. \nJumlah murid yang antusias selama mengikuti sesi-sesi yang ada dalam program yang diselenggarakan tersebut. \nKesamaan frekuensi perilaku berbagi pengetahuan pada kedua kelompok murid sebelum program.","passage":"","images":[],"options":[],"answer":null,"explanation":""},{"id":"q0247","kind":"slide","subject":"PU","source":"FR DAY 3 UTBK 2026.pptx","page":21,"title":"FR DAY 3 UTBK 2026 · Slide 21","text":"20).  Bima telah satu tahun menggantikan saudaranya mengelola penginapan keluarga di daerah wisata. Sejak awal, tingkat keluar-masuk staf pelayanan tamu cukup tinggi sehingga pada akhir pekan dan masa liburan, jumlah staf sering tidak mencukupi. Akibatnya, respon terhadap permintaan tamu menjadi lambat dan banyak tamu yang enggan untuk Kembali. Bima mempertimbangkan untuk membagi lebih banyak tugas kepada staf yang tersisa, tetapi ia khawatir mereka menolak. Strategi yang PALING EFEKTIF yang dapat dilakukan Bima untuk mengatasi situasi tersebut adalah …. \nMemberbaharui sistem kontrak kerja pegawai yang memuat aturan jam kerja minimal \nMeminta staf yang tidak sedang bertugas untuk bekerja pada masa liburan dan akhir pekan \nMenyesuaikan prioritas layanan berdasarkan jenis permintaan tamu untuk menjaga kelancaran operasional \nMengalihkan Sebagian tugas layanan kepada staf administrasi untuk mempercepat penanganan permintaan tamu \n Menyederhanakan prosedur layanan agar setiap permintaan tamu dapat ditangani dalam waktu singkat","passage":"","images":[],"options":[],"answer" nC. 300 \nD. 360 \nE. 450 \n6. \nJika peternak mengambil 3 bebek berbulu putih secara acak. Peluang terambil \nsetidaknya 2 bebek betina adalah ... \nA. 51/55 \nB. 52/55 \nC. 45/55 \nD. 46/66 \nE. 45/47 \n7. \nJika kebutuhan pakan bebek betina perhari adalah 250 gram, maka total \nkebutuhan pakan seluruh bebek selama 4 hari adalah … \nA. 26 kg \nB. 30 kg \nC. 28 kg \nD. 12 kg \nE. 16 kg \n8. \nDari seluruh bebek tersebut dipilih 2 bebek secara acak dengan ketentuan 1 jantan \n1 betina. Peluang bahwa kedua bebek yang terpilih memiliki warna bulu berbeda \nadalah … \nA. 24/90 \nB. 36/95 \nC. 37/95 \nD. 48/95 \nE. 56/95 \n\nTwitter @pintarkalkulus\nPembahasan Klik gambar lampu","passage":"","images":["assets/questions/pdf_7_014.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0314","kind":"halaman","subject":"PK","source":"Bank soal pk pm snbt 26 update 27 april.pdf","page":16,"title":"Bank soal pk pm snbt 26 update 27 april · Halaman 16","text":"@pintarkalkulus\nBarisan bilangan, bangun datar (Geometri) \nTeks \nPerhatikan gambar di bawah ini \n \n9. \nBerdasarkan gambar lingkaran di atas, diketahui jari-jari lingkaran membentuk \nbarisan 40, 24, 16, 12, … . Jari jari lingkaran ke-6 adalah … \n10. Berdasarkan gambar lingkaran di atas, diketahui jari-jari lingkaran membentuk \nbarisan 40, 24, 16, 12, … .Tentukan panjang jari-jari lingkaran ke-7! \n11. Berdasarkan gambar lingkaran di atas, diketahui jari-jari lingkaran membentuk \nbarisan 40, 24, 16, 12, … . Hitung keliling lingkaran ke-5! (Gunakan \n3,14\n=\n atau \nbiarkan dalam bentuk ) \n12. Berdasarkan gambar lingkaran di atas, diketahui jari-jari lingkaran membentuk \nbarisan 40, 24, 16, 12, … . Berapakah selisih luas antara lingkaran ke-4 dan \nlingkaran ke-5? \nStatistika \nTeks \nDi sebuah taman bermain anak-anak, diadakan sebuah penelitian mengenai lamanya \nwaktu bermain anak-anak di lokasi tersebut. Ternyata waktu lama bermain anak-anak \ndi tempat tersebut dipengaruhi oleh faktor cuaca. Total a lan September 2024 adalah 120 ton. Setiap jenis \nsampah diasumsikan hanya masuk ke salah satu kategori pengelolaan. \nTwitter @pintarkalkulus\nPembahasan Klik gambar lampu","passage":"","images":["assets/questions/pdf_7_020.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0320","kind":"halaman","subject":"PK","source":"Bank soal pk pm snbt 26 update 27 april.pdf","page":22,"title":"Bank soal pk pm snbt 26 update 27 april · Halaman 22","text":"@pintarkalkulus\n \n31. Jika 2\n5  sampah kaca, logam, dan kertas didaur ulang, jumlah sampah daur ulang \nyang berasal dari sampah plastik dan organik adalah … ton (*) \nA. 14 \nB. 15 \nC. 27 \nD. 34 \nE. 48 \n32. Jika seluruh sampah yang dibuang ke TPA berasal dari sampah organik dan \nplastik saja, maka perbandingan massa sampah organik terhadap plastik yang \nmasuk ke TPA adalah …… \nA. 1 : 1 \nB. 2 : 1 \nC. 3 : 2 \nD. 4 : 1 \nE. 5 : 2 \n33. Diketahui total sampah adalah 120 ton. Jika 50% dari sampah plastik dibakar dan \nsisanya digunakan kembali, maka jumlah sampah plastik yang digunakan \nkembali adalah … ton. \nA. 6 \nB. 8 \na. 10 \nb. 12 \nc. \n15 \n34. Jika seluruh sampah yang dikomposkan berasal dari sampah organik, berapakah \npersentase sampah organik yang tidak dikomposkan? \nA. 50% \nB. 60% \nC. 75% \nD. 80% \nE. 90% \nTwitter @pintarkalkulus\nPembahasan Klik gambar lampu","passage":"","images":["assets/questions/pdf_7_021.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0321","kind":"halaman","subject":"PK","source":"Bank soal pk pm snbt 26 update 27 april.pdf","page":23,"title":"Bank soal pk pm snbt 26 update 27 april · Halaman 23","text":"@pintarkalkulus\nDeret Aritmatika \nTeks \nSebuah Perusahaan produksi kulkas mencatat bahwa pada januari 2022 jumlah \nproduksinya adalah 1.500 unit, sedangkan pada Februari 2022 meningkat menjadi \n1.580 unit. \nManajemen menyatakan bahwa kenaikan produksi tidak selalu tetap, melainkan \nmengikuti strategi adaptif: \nJika permintaan stabil, produksi naik dengan selisih yang sama seperti bulan \nsebelumnya. Namun, jika total produksi sudah melampaui 5.000 unit secara \nkumulatif, maka mulai bulan berikutnya kenaikan produksi menjadi setengah dari \nkenaikan sebelumnya (dibulatkan ke bawah jika perlu). \nDiasumsikan permintaan pasar stabil hingga April, dan setelah itu aturan \npenyesuaian mulai berlaku jika syarat terpenuhi \n35. Produksi bulan Maret 2022 adalah … \nA. 6.200 \nB. 1.640 \nC. 1.660 \nD. 16.80 \nE. 1.700 \n36. Total produksi dari Januari hingga April 2022 adalah … \nA. 6.200 \nB. 6.320 \nC. 6.440 \nD. 6.560 \nE. 6.680 \n37. Jika aturan penyesuaian mulai berlaku setelah April, maka kenaikan produksi \ndari April ke Mei adalah … \nA. 20 unit \nB. 30 unit \nC. 40 unit \nD. 50 unit \nE. 80 unit \n38. Manakah pernyataan berikut yang BENAR? \nA. Produksi selalu membentuk barisan aritmetika hingga Juni. \nB. Setelah melewati 5.000 unit, produksi menjadi konstan. \nC. Kenaikan produksi setelah April lebih kecil disbanding sebelumnya \nD. Total produksi Mei lebih kecil dari April \nE. Tidak ada perubahan pola. \n\nTwitter @pintarkalkulus\nPembahasan Klik gambar lampu","passage":"","images":["assets/questions/pdf_7_022.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0322","kind":"halaman","subject":"PK","source":"Bank soal pk pm snbt 26 update 27 april.pdf","page":24,"title":"Bank soal pk pm snbt 26 update 27 april · Halaman 24","text":"@pintarkalkulus\nPembahasan Soal Ada di Link \nChannel Youtube Pintar Kalkulus \n \nLink Playlist youtube \n: \nhttps://www.youtube.com/playlist?list=PLlFXzo0Ktu6unwECnqDqSmDDce_H_VZ6N \n \nLink grup Pemburu soal snbt 2026 \nhttps://chat.whatsapp.com/BbV6L3ERApXIlKqBTKy8UO \n \nLink grup telegram snbt 2026 \nhttps://t.me/pintarkalkulus_grup \nLink bank soal snbt \nhttps://t.me/pintarkalkulus/ \nTwitter @pintarkalkulus\nPembahasan Klik gambar lampu","passage":"","images":["assets/questions/pdf_7_023.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0323","k kayu, 6 kaleng cat tembok, dan 4 kaleng \ncat besi di toko tersebut, ia harus membayar sebanyak …. \nA. Rp620.000,00 \nB. Rp622.000,00 \nC. Rp634.000,00 \nD. Rp738.000,00 \nE. Rp836.000,00 \n4. \nJika harga cat naik, kenaikan harga cat kayu per kaleng adalah ½ kali kenaikan \nharga cat tembok per kaleng. Harga cat besi tidak mengalami kenaikan. Jika \nselisih harga cat tembok dan cat besi per kaleng sekarang Rp48.000,00, maka \nkenaikan harga cat tembok per kaleng adalah …. \nA. Rp8.000,00 \nB. Rp9.000,00 \nC. Rp10.000,00 \nD. Rp11.000,00 \nE. Rp12.000,00 \n\nTwitter @pintarkalkulus\nPembahasan Klik gambar lampu","passage":"","images":["assets/questions/pdf_12_020.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0583","kind":"halaman","subject":"PK","source":"Bank soal pk pm snbt 26 update 27 april new.pdf","page":22,"title":"Bank soal pk pm snbt 26 update 27 april new · Halaman 22","text":"@pintarkalkulus\nPeluang, kombinasi \nTeks \nSeorang peternak bebek memiliki 10 bebek jantan dan 10 bebek betina. Dari seluruh \nbebek tersebut, 45% berbulu hitam sedangkan sisanya berbulu putih. Dua bebek \njantan berbulu putih. Kebutuhan pakan bebek jantan adalah 60% lebih banyak \ndibanding bebek betina. \n5. \nSuatu saat peternak diminta mengambil 3 bebek. Banyak cara memilih 2 bebek \nbetina berbulu putih dan bebek jantan adalah … \nA. 170 \nB. 250 \nC. 300 \nD. 360 \nE. 450 \n6. \nJika peternak mengambil 3 bebek berbulu putih secara acak. Peluang terambil \nsetidaknya 2 bebek betina adalah ... \nA. 51/55 \nB. 52/55 \nC. 45/55 \nD. 46/66 \nE. 45/47 \n7. \nJika kebutuhan pakan bebek betina perhari adalah 250 gram, maka total \nkebutuhan pakan seluruh bebek selama 4 hari adalah … \nA. 26 kg \nB. 30 kg \nC. 28 kg \nD. 12 kg \nE. 16 kg \n8. \nDari seluruh bebek tersebut dipilih 2 bebek secara acak dengan ketentuan 1 jantan \n1 betina. Peluang bahwa kedua bebek yang terpilih memiliki warna bulu berbeda \nadalah … \nA. 24/90 \nB. 36/95 \nC. 37/95 \nD. 48/95 \nE. 56/95 \n\nTwitter @pintarkalkulus\nPembahasan Klik gambar lampu","passage":"","images":["assets/questions/pdf_12_021.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0584","kind":"halaman","subject":"PK","source":"Bank soal pk pm snbt 26 update 27 april new.pdf","page":23,"title":"Bank soal pk pm snbt 26 update 27 april new · Halaman 23","text":"@pintarkalkulus\nBarisan bilangan, bangun datar (Geometri) \nTeks \nPerhatikan gambar di bawah ini \n \n9. \nBerdasarkan gambar lingkaran di atas, diketahui jari-jari lingkaran membentuk \nbarisan 40, 24, 16, 12, … . Jari jari lingkaran ke-6 adalah … \n10. Berdasarkan gambar lingkaran di atas, diketahui jari-jari lingkaran membentuk \nbarisan 40, 24, 16, 12, … .Tentukan panjang jari-jari lingkaran ke-7! \n11. Berdasarkan gambar lingkaran di atas, diketahui jari-jari lingkaran membentuk \nbarisan 40, 24, 16, 12, … . Hitung keliling lingkaran ke-5! (Gunakan \n3,14\n=\n atau \nbiarkan dalam bentuk ) \n12. Berdasarkan gambar lingkaran di atas, diketahui jari-jari lingkaran membentuk \nbarisan 40, 24, 16, 12, … . Berapakah selisih luas antara lingkaran ke-4 dan \nlingkaran ke-5? \nStatistika \nTeks \nDi sebuah taman bermain anak-anak, diadakan sebuah penelitian mengenai lamanya \nwaktu bermain anak-anak di lokasi tersebut. Ternyata waktu lama bermain anak-anak \ndi tempat tersebut dipengaruhi oleh faktor cuaca. Total anak-anak yang bermain di \npagi hari adalah 40 anak dan total yang bermain di sore hari sama besarnya dengan \ntotal anak di pagi hari. \n\nTwitter @pintarkalkulus\nPembahasan Klik gambar lampu","passage":"","images":["assets/questions/pdf_12_022.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0585","kind":"halaman","subject":"PK","source":"Bank soal pk pm snbt 26 update 27 april new.pdf","page":24,"title":"Bank soal pk pm snbt 26 update 27 april new · Halaman 24","text":"@pintarkalkulus\nTabel data waktu bermain \nLama bermain \nJam pagi (banyak anak) Jam sore (banyak anak) \n10-17 \n7 \n4 \n18-27 \n18 \n10 \n28-37 \n10 \n13 \n38-47 \n2 \n6 \n48-57 \n3 \n7 \nTotal \n40 \n40 \n13. Perbandingan banyak anak yang bermain lebih dari 37 menit pada pagi dan sore \nadalah … \nA. 6 : 11 \nB. 7 : 12 \nC. 5 : 13 \nD. 4 : 10 \nE. 3 : 8 \n14. Akibat hujan, anak dari interval 18-27 menit (pagi) berpindah ke interval 10-17 \nmenit. Perbandingan banyak anak pada interval 10-17 menit (pagi setelah \nperubahan) dengan interval yang sama pada sore hari adalah … \nA. 26 : 8 \nB. 25 : 4 \nC. 23 : 9 \nD. 22 : 5 \nE. 21 : 2 \n15. Persentase jumlah anak pada interval 10-17 menit (pagi setelah hujan) terhadap \ntotal anak sore hari adalah … \nA. 64,5% \nB. 65% \nC. 67,5% \nD. 60% \nE. 62,5% \n16. Rata-rata waktu bermain anak pada jam pagi adalah … \nA. 23,15 menit \nB. 24,23 menit \nC. 25,82 menit \nD. 26,67 menit \nE. 27,76 menit \n17. Jika terjadi hujan, maka kelas modus waktu bermain anak pada pagi hari \ncenderung bergeser menjadi … \nTwitter @pintarkalkulus\nPembahasan Klik gambar lampu","passage":"","images":["assets/questions/pdf_12_023.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0586","kind":"halaman","subject":"PK","source":"Bank soal pk pm snbt 26 update 27 april new.pdf","page":25,"title":"Bank soal pk pm snbt 26 update 27 april new · Halaman 25","text":"@pintarkalkulus\nA. 10-17 menit \nB. 18-27 menit \nC. 28-37 menit \nD. 38-47 menit \nE. 48-57 menit \n \nBangun ruang, bangun datar (Geometri) \nTeks \nSebuah jembatan penyeberangan dilihat dari samping memiliki bentuk trapesium \nABCD dengan AB pada lantai jembatan dan CD pada atap jembatan. Untuk \nmemperkuat struktur jembatan, dipasang rangka yang membentuk diagonal AC dan \nBD yang berpotongan di titik P. Diketahui bahwa AB=12 meter dan CD=6 meter.\n \n18. Jika AD = BC dan tinggi jembatan 4 meter, panjang AD = … meter. \nA. 5 \nB. 6 \nC. 7 \nD. 8 \nE. 9 \n19. Sebuah jembatan memiliki bentuk trapesium ABCD dengan AB∥CD, panjang \nAB=14 m dan CD=8 m. Tinggi trapesium adalah 6 m. Diagonal AC dan BD \nberpotongan di titik P. Perbandingan luas segitiga APB dan CPD adalah … \nA. 1 : 1 \nB. 7 : 4 \nC. 2 : 1 \nD. 14 : 8 \nE. 49 : 16 \n20. Jika Pada jembatan berbentuk trapesium ABCD dengan AB CD, diketahui \nAB=12 m dan CD=6 m. Diagonal AC dan BD berpotongan di titik P. \nPerbandingan panjang AP : PC adalah … \nA. 1 : 1 \nB. 2 : 1 \nC. 3 : 1 \nD. 1 : 2 \nE. 1 : 3 \nTwitter @pintarkalkulus\nPembahasan Klik gambar lampu","passage":"","images":["assets/questions/pdf_12_024.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0587","kind":"halaman","subject":"PK","source":"Bank soal pk pm snbt 26 update 27 april new.pdf","page":26,"title":"Bank soal pk pm snbt 26 update 27 april new · Halaman 26","text":"@pintarkalkulus\n21. Sebuah kabel dipasang dari titik A ke titik C (diagonal AC) pada jembatan \nberbentuk trapesium dengan tinggi 4 m, AB=12 m dan CD=6 m. Jika titik D dan \nC berada tepat di tengah secara horizontal terhadap A dan B, maka panjang \nminimum kabel AC adalah … \nA. \n100  \nB. \n116  \nC. \n136  \nD. \n160  \nE. \n180  \nBangun datar (Geometri) \nTeks \nSebuah kecil berbentuk lingkaran yang memiliki tiga lapisan seperti gambar berikut. \nDiketahui jarak pohon A ke pohon B adalah 130 cm dan \n90\nACB\n\n=\n○\n\n22. Diameter taman seluruh nya adalah … \nA. 95 cm \nB. 125 cm \nC. 150 cm \nD. 160 cm \nE. 190 cm \n23. Dua anak kecil berjalan dengan arah putaran yang sama dari titik P dan Q \nmasing-masing dengan menepuh jarak 3\n cm dan 4\n cm setiap detiknya. Mereka \nberjalan selama 6 menit sehingga masing-masing mencapai P’ dan Q’. Jika \n120\nPOQ\n\n=\n○\n, maka jarak P’ ke Q’ adalah … \n24. Taman kecil tersebut akan ditanami bunga. Lingkaran terluar akan ditanami \nbunga aster dengan harga Rp 10.000, 00 per \n2\ncm , lingkaran tengah akan ditanami \nbunga melati dengan Rp 20.000,00 per \n2\ncm , dan dibagian tengah ditanami bunga \nTwitter @pintarkalkulus\nPembahasan Klik gambar lampu","passage":"","images":["assets/questions/pdf_12_025.webp"],"opti ,"page":28,"title":"Bank soal pk pm snbt 26 update 27 april new · Halaman 28","text":"@pintarkalkulus\npersegi yang sama besar, dimana bagian tengahnya dikosongkan (tidak diarsir), \nsehingga menyisakan 8 sub-persegi yang berwarna. \nProses ini berlanjut pada setiap sub-persegi yang tersisa di tahap-tahap berikutnya \n(\n)\n3\n4\n,\n,...,\nn\nK K\nK\n, di mana setiap sub-persegi yang berwarna akan selalu dibagi kembali \nmenjadi 9 bagian kecil dan bagian tengahnya dibuang. Fenomena ini menciptakan \npola fraktal yang dikenal sebagai Karpet Sierpinski, dimana rasio jumlah area yang \ndiarsir terhadap area total terus berkurang seiring bertambahnya urutan pola (n). \n \n29. Berdasarkan deskripsi teks, luas bagian karpet yang diarsir (berwarna) pada pola \nke-2 (\n)\n2\nK\n adalah … \n2\nm  \nA. 48,22 \nB. 52,88 \nC. 56,88 \nD. 60,44 \nE. 62,22 \n30. Perbandingan antara luas bagian yang diarsir pada pola ke-5 terhadap luas \nbagian yang diarsir pada pola ke-2 adalah … \nA. 512 : 729 \nB. 64 : 81 \nC. 8 : 9 \nD. 216 : 343 \nE. 64 : 729 \n \nPersentase \nTeks \nDalam rangka meningkatkan efektivitas pengelolaan lingkungan, telah dilakukan \npendataan terhadap jumlah sampah yang dihasilkan selama satu minggu pada suatu \ndaerah. Setiap jenis sampah dan metode pengelolaannya dikelompokkan dalam lima \nkategori seperti tampak pada diagram berikut. Jumlah sampah yang dihasilkan \nmasyarakat daerah tersebut pada bulan September 2024 adalah 120 ton. Setiap jenis \nsampah diasumsikan hanya masuk ke salah satu kategori pengelolaan. \nTwitter @pintarkalkulus\nPembahasan Klik gambar lampu","passage":"","images":["assets/questions/pdf_12_027.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0590","kind":"halaman","subject":"PK","source":"Bank soal pk pm snbt 26 update 27 april new.pdf","page":29,"title":"Bank soal pk pm snbt 26 update 27 april new · Halaman 29","text":"@pintarkalkulus\n \n31. Jika 2\n5  sampah kaca, logam, dan kertas didaur ulang, jumlah sampah daur ulang \nyang berasal dari sampah plastik dan organik adalah … ton (*) \nA. 14 \nB. 15 \nC. 27 \nD. 34 \nE. 48 \n32. Jika seluruh sampah yang dibuang ke TPA berasal dari sampah organik dan \nplastik saja, maka perbandingan massa sampah organik terhadap plastik yang \nmasuk ke TPA adalah …… \nA. 1 : 1 \nB. 2 : 1 \nC. 3 : 2 \nD. 4 : 1 \nE. 5 : 2 \n33. Diketahui total sampah adalah 120 ton. Jika 50% dari sampah plastik dibakar dan \nsisanya digunakan kembali, maka jumlah sampah plastik yang digunakan \nkembali adalah … ton. \nA. 6 \nB. 8 \na. 10 \nb. 12 \nc. \n15 \n34. Jika seluruh sampah yang dikomposkan berasal dari sampah organik, berapakah \npersentase sampah organik yang tidak dikomposkan? \nA. 50% \nB. 60% \nC. 75% \nD. 80% \nE. 90% \nTwitter @pintarkalkulus\nPembahasan Klik gambar lampu","passage":"","images":["assets/questions/pdf_12_028.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0591","kind":"halaman","subject":"PK","source":"Bank soal pk pm snbt 26 update 27 april new.pdf","page":30,"title":"Bank soal pk pm snbt 26 update 27 april new · Halaman 30","text":"@pintarkalkulus\nDeret Aritmatika \nTeks \nSebuah Perusahaan produksi kulkas mencatat bahwa pada januari 2022 jumlah \nproduksinya adalah 1.500 unit, sedangkan pada Februari 2022 meningkat menjadi \n1.580 unit. \nManajemen menyatakan bahwa kenaikan produksi tidak selalu tetap, melainkan \nmengikuti strategi adaptif: \nJika permintaan stabil, produksi naik dengan selisih yang sama seperti bulan \nsebelumnya. Namun, jika total produksi sudah melampaui 5.000 unit secara \nkumulatif, maka mulai bulan berikutnya kenaikan produksi menjadi setengah dari \nkenaikan sebelumnya (dibulatkan ke bawah jika perlu). \nDiasumsikan permintaan pasar stabil hingga April, dan setelah itu aturan \npenyesuaian mulai berlaku jika syarat terpenuhi \n35. Produksi bulan Maret 2022 adalah … \nA. 6.200 \nB. 1.640 \nC. 1.660 \nD. 16.80 \nE. 1.700 \n36. Total produksi dari Januari hingga April 2022 adalah … \nA. 6.200 \nB. 6.320 \nC. 6.440 \nD. 6.560 \nE. 6.680 \n37. Jika aturan penyesuaian mulai berlaku setelah April, maka kenaikan produksi \ndari April ke Mei adalah … \nA. 20 unit \nB. 30 unit \nC. 40 unit \nD. 50 unit \nE. 80 unit \n38. Manakah pernyataan berikut yang BENAR? \nA. Produksi selalu membentuk barisan aritmetika hingga Juni. \nB. Setelah melewati 5.000 unit, produksi menjadi konstan. \nC. Kenaikan produksi setelah April lebih kecil disbanding sebelumnya \nD. Total produksi Mei lebih kecil dari April \nE. Tidak ada perubahan pola. \n\nTwitter @pintarkalkulus\nPembahasan Klik gambar lampu","passage":"","images":["assets/questions/pdf_12_029.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0592","kind":"halaman","subject":"PK","source":"Bank soal pk pm snbt 26 update 27 april new.pdf","page":31,"title":"Bank soal pk pm snbt 26 update 27 april new · Halaman 31","text":"@pintarkalkulus\nPembahasan Soal Ada di Link \nChannel Youtube Pintar Kalkulus \n \nLink Playlist youtube \n: \nhttps://www.youtube.com/playlist?list=PLlFXzo0Ktu6unwECnqDqSmDDce_H_VZ6N \n \nLink grup Pemburu soal snbt 2026 \nhttps://chat.whatsapp.com/BbV6L3ERApXIlKqBTKy8UO \n \nLink grup telegram snbt 2026 \nhttps://t.me/pintarkalkulus_grup \nLink bank soal snbt \nhttps://t.me/pintarkalkulus/ \nTwitter @pintarkalkulus\nPembahasan Klik gambar lampu","passage":"","images":["assets/questions/pdf_12_030.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0593","kind":"halaman","subject":"PK","source":"PK ASLI 2026 SERI 1.pdf","page":1,"title":"PK ASLI 2026 SERI 1 · Halaman 1","text":"","passage":"","images":["assets/questions/pdf_15_000.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0594","kind":"halaman","subject":"PK","source":"PK ASLI 2026 SERI 1.pdf","page":2,"title":"PK ASLI 2026 SERI 1 · Halaman 2","text":"","passage":"","images":["assets/questions/pdf_15_001.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0595","kind":"halaman","subject":"PK","source":"PK ASLI 2026  tersebut tidak menimbulkan polusi udara. Sebagian masyarakat juga menjadikan bersepeda sebagai olahraga harian. Kebiasaan ini mulai terlihat pada jam berangkat dan pulang kerja.\nPemerintah daerah kemudian membangun jalur khusus sepeda di beberapa ruas jalan. Tempat parkir sepeda juga disediakan di kawasan perkantoran. Sejumlah taman kota menambah area penyimpanan sepeda. Fasilitas itu dibuat agar pengguna merasa aman dan nyaman. Dengan demikian, minat masyarakat diharapkan terus meningkat.\nMeskipun begitu, masih terdapat sejumlah kendala di lapangan. Jalur sepeda kadang digunakan kendaraan bermotor. Kesadaran sebagian pengguna jalan terhadap pesepeda juga masih rendah. Karena itu, edukasi keselamatan berlalu lintas perlu ditingkatkan. Kerja sama semua pihak dibutuhkan agar budaya bersepeda berkembang.\nSoal:","images":[],"options":["Jalur Sepeda di Tengah Kota","Manfaat Olahraga dengan Sepeda","Perkembangan Budaya Bersepeda di Perkotaan","Penyebab Kemacetan di Kota Besar","Cara Aman Mengendarai Sepeda"],"answer":"C","explanation":"Teks membahas pertumbuhan budaya bersepeda, fasilitas pendukung, dan kendalanya, sehingga C merangkum seluruh isi."},{"id":"q0619","kind":"pilihan","subject":"PBM","source":"pbm day 1.docx","page":"Soal 2","title":"Soal 2","text":"Kalimat manakah yang maknanya sama dengan kalimat (6)?","passage":"Bacalah paragraf berikut ini!\n(1) Penggunaan transportasi umum terus didorong di kota besar.\n(2) Pemerintah menambah jumlah armada pada jam sibuk.\n(3) Warga mulai beralih dari kendaraan pribadi.\n(4) Meski demikian, kepadatan penumpang masih sering terjadi.\n(5) Karena itu, beberapa kebijakan baru diterapkan.\n(6) Operator menambah frekuensi keberangkatan supaya waktu tunggu penumpang berkurang.\nSoal:","images":[],"options":["Operator mengurangi penumpang dengan menambah waktu tunggu keberangkatan.","Agar penumpang sering berangkat, operator menambah waktu tunggu.","Penumpang menambah keberangkatan supaya operator mengurangi waktu.","Waktu tunggu operator berkurang karena keberangkatan penumpang ditambah.","Operator memperbanyak jadwal keberangkatan agar penumpang tidak menunggu lama."],"answer":"E","explanation":"Menambah frekuensi sama artinya memperbanyak jadwal keberangkatan sehingga waktu tunggu lebih singkat."},{"id":"q0620","kind":"pilihan","subject":"PBM","source":"pbm day 1.docx","page":"Soal 3","title":"Soal 3","text":"Informasi utama paragraf tersebut adalah ….","passage":"Bacalah paragraf berikut ini!\nPenggunaan transportasi umum cenderung meningkat ketika layanan yang tersedia nyaman dan tepat waktu. Masyarakat lebih bersedia meninggalkan kendaraan pribadi jika waktu tempuh dapat diprediksi. Kebersihan armada dan keamanan penumpang juga sangat memengaruhi keputusan pengguna. Karena itu, peningkatan jumlah penumpang tidak hanya bergantung pada penambahan armada. Kualitas pelayanan merupakan faktor yang tidak kalah penting.\nSoal:","images":[],"options":["Penambahan armada bukan satu-satunya cara menaikkan jumlah penumpang.","Kualitas layanan menentukan minat masyarakat menggunakan transportasi umum.","Ketepatan waktu menjadi alasan utama masyarakat naik transportasi umum.","Kendaraan pribadi ditinggalkan jika transportasi umum murah.","Kebersihan armada lebih penting daripada jumlah armada."],"answer":"B","explanation":"Gagasan pokok menghubungkan kualitas layanan dengan minat menggunakan transportasi umum."},{"id":"q0621","kind":"pilihan","subject":"PBM","source":"pbm day 1.docx","page":"Soal 4","title":"Soal 4","text":"Kalimat yang mengandung makna konotatif/perumpamaan adalah ….","passage":"Bacalah paragraf berikut ini!\n(1) Pada awal penerapan kurikulum baru, banyak guru mengaku kesulitan menyesuaikan metode pembelajaran.\n(2) Sekolah kemudian mengadakan pelatihan intensif yang melibatkan instruktur dari berbagai daerah.\n(3) Guru-guru senior dan muda diminta bekerja sama menyusun perangkat ajar yang lebih adaptif.\n(4) Dari proses itu, muncul sejumlah pendidik yang menjadi kompas bagi rekan-rekannya.\n(5) Dalam semester berikutnya, pelaksanaan pembelajaran berlangsung jauh lebih tertata.\nSoal:","images":[],"options":["Kalimat (1)","Kalimat (2)","Kalimat (3)","Kalimat (4)","Kalimat (5)"],"answer":"D","explanation":"Ungkapan menjadi kompas menggunakan makna kiasan sebagai panutan atau pemberi arah."},{"id":"q0622","kind":"pilihan","subject":"PPU","source":"ppu day1.docx","page":"Soal 6","title":"Soal 6","text":"Suasana yang dominan dalam kutipan puisi tersebut adalah ….","passage":"Perhatikan puisi berikut ini!\nAku ingin mencintaimu dengan sederhana\nDengan kata yang tak sempat diucapkan\nKayu kepada api yang menjadikannya abu\nAku ingin mencintaimu dengan sederhana\nDengan isyarat yang tak sempat disampaikan\nAwan kepada hujan yang menjadikannya tiada\nSapardi Djoko Damono, Aku Ingin","images":[],"options":["Tenang, tulus, dan romantis","Haru, sedih, dan penuh penyesalan","Rindu, cemas, dan gelisah","Kagum, bangga, dan menggebu-gebu","Damai, tetapi menyimpan kemarahan"],"answer":null,"explanation":""},{"id":"q0623","kind":"pilihan","subject":"PPU","source":"ppu day1.docx","page":"Soal 5","title":"Soal 5","text":"Kalimat yang memiliki pola sama dengan kalimat (5) adalah ….","passage":"Bacalah paragraf berikut ini!\n(1) Dalam dua tahun terakhir, pemerintah kota memperbaiki kawasan perdagangan lama yang sempat terbengkalai cukup lama.\n(2) Sejumlah pedagang yang menempati kios baru mulai merasakan kenaikan jumlah pembeli setiap pekan.\n(3) Para petugas lapangan menata jalur pejalan kaki yang rusak di sisi utara kawasan itu.\n(4) Banyak pengunjung menilai fasilitas umum di lokasi tersebut semakin nyaman digunakan keluarga.\n(5) Sejak pagi, panitia membagikan kupon makan yang berwarna biru kepada peserta.\n(6) Pengelola akan menambah ruang pertunjukan seni pada tahap berikutnya.","images":[],"options":["Para siswa mengikuti pelatihan kepemimpinan yang berlangsung di aula utama.","Kepala sekolah menjelaskan aturan baru yang telah direvisi kepada wali murid kemarin.","Pada siang hari, petugas menyerahkan bantuan pangan yang baru datang kepada warga.","Pemerintah sedang membangun jembatan penghubung yang melintasi sungai besar.","Pada siang hari, petugas yang baru datang menyerahkan bantuan pangan kepada warga."],"answer":null,"explanation":""},{"id":"q0624","kind":"pilihan","subject":"PPU","source":"ppu day1.docx","page":"Soal 4","title":"Soal 4","text":"Perbaikan paling tepat untuk kalimat (1) adalah ….","passage":"baca!\n(1) Sejumlah pakar pendidikan menilai bahwa kemampuan literasi siswa perlu segera ditingkatkan.\n(2) Rendahnya minat baca dikhawatirkan akan berdampak pada kualitas pembelajaran di masa depan.\n(3) Sekolah mulai merancang berbagai program membaca yang lebih menarik bagi peserta didik.\n(4) Guru juga didorong memanfaatkan teknologi digital untuk memperluas akses bahan bacaan.\n(5) Dengan langkah tersebut, budaya literasi diharapkan tumbuh lebih kuat.","images":[],"options":["Sejumlah pakar pendidikan menilai kemampuan literasi siswa perlu segera ditingkatkan.","Sejumlah pakar pendidikan menilai bahwa kemampuan literasi siswa perlu ditingkatkan segera.","Menurut sejumlah pakar pendidikan, kemampuan literasi siswa perlu segera ditingkatkan.","Sejumlah pakar pendidikan menilai kalau kemampuan literasi siswa perlu segera ditingkatkan.","Sejumlah pakar pendidikan menilai bahwa kemampuan literasi siswa segera perlu ditingkatkan."],"answer":null,"explanation":""},{"id":"q0625","kind":"pilihan","subject":"PPU","source":"ppu day1.docx","page":"Soal 3","title":"Soal 3","text":"Kata penghubung yang paling tepat untuk melengkapi kalimat (2) adalah ….","passage":"Bacalah paragraf berikut ini!\n(1) Transformasi sistem pembayaran di Indonesia berkembang sangat cepat dalam beberapa tahun terakhir.\n(2) […] penggunaan uang tunai masih dijumpai di pasar tradisional dan wilayah yang akses digitalnya terbatas.\n(3) Masyarakat perkotaan kini semakin terbiasa memakai dompet elektronik, kartu nirsentuh, serta layanan pemindaian kode respons cepat.\n(4) Perubahan tersebut mendorong transaksi menjadi lebih praktis, cepat, dan tercatat secara otomatis.\n(5) Pelaku usaha kecil pun mulai menyesuaikan diri dengan menyediakan berbagai metode pembayaran non tunai.\n(6) Pemerintah dan lembaga keuangan terus memperluas edukasi agar manfaat sistem pembayaran digital dapat dirasakan lebih merata.","images":[],"options":["Tetapi","Namun","Oleh karena itu","Sebaliknya","Selain itu"],"answer":null,"explanation":""},{"id":"q0626","kind":"halaman","subject":"PK","source":"TAMBAHAN4 PK 2026.pdf","page":1,"title":"TAMBAHAN4 PK 2026 · Halaman 1","text":"TAMBAHAN PK 2026 \n1. \nDiketahui fungsi 𝑔(𝑥) = 𝑥2 + 𝑏𝑥. \n Jika 𝑔(𝑏+ 1) = 𝑔(𝑏) + 𝑔(1) + 4 , dengan b \nbilangan positif , nilai b sama dengan… \n(A) 1 \n(B) 2 \n(C) 3 \n(D) 4 \n(E) 5 \n \n2. \nDiketahui fungsi 𝑓(𝑥) = 𝑥2 + 𝑏𝑥. \nJika berlaku 𝑓(𝑎+ 𝑏) = 𝑓(𝑎) + 𝑓(𝑏) + 𝑓(3) , \nuntuk a , b positif dengan 𝑎> 𝑏 , nilai a sama \ndengan… \n(A) 2 \n(B) 3 \n(C) 4 \n(D) 5 \n(E) 6 \n \n3. \nBanyak bilangan di antara 10.000 dan 20.000 \nyang merupakan kelipatan 5 , terdiri dari angka-\nangka berbeda dan jumlah digit ke-1 , ke-3 , dan \nke-5 adalah 9 sama dengan… \n(A) 84 \n(B) 60 \n(C) 42 \n(D) 30 \n(E) 18 \n \n4. \nGaji X tahun ini Rp5.800.000,00.  \nGaji X dua tahun yang lalu sama dengan dua kali \ngaji Y. Jika X dan Y mendapat kenaikan \nRp100.000,00 setiap tahun , Gaji Y dua tahun \nyang akan datang sama dengan… \n(A) Rp1.600.000,00 \n(B) Rp3.000.000,00 \n(C) Rp3.200.000,00 \n(D) Rp3.800.000,00 \n(E) Rp4.000.000,00 \n \n5. \nDiketahui 𝑎2 =\n9\n𝑏  dan 𝑎𝑏= 3.  Nilai dari 𝑎 sama \ndengan… \n(A) 1 \n(B) 2 \n(C) 3 \n(D) 4 \n(E) 5 \n \n6. \nJika p dan q adalah bilangan bulat positif yang \nmemenuhi √25 × 49 × 𝑝\n3\n= 𝑞 , nilai terkecil dari \np + q sama dengan… \n(A) 98 \n(B) 70 \n(C) 68 \n(D) 50 \n(E) 35 \n\n7. \n28 jika dibagi dengan bilangan bulat n bersisa 1. \nJumlah semua nilai n yang mungkin sama \ndengan… \n(A) 2 \n(B) 3 \n(C) 9 \n(D) 30 \n(E) 39 \n \n8. \nDiketahui 𝑓(𝑥) = 𝑥+ 5  dan  𝑔(𝑥) = 𝑥2 + 1 \ndengan 𝑥≥0. \nNilai 𝑔−1(𝑓(5)) = ⋯ \n(A) 2 \n(B) 3 \n(C) 4 \n(D) 5 \n(E) 6 \n \n9. \nBanyaknya permutasi enam digit 1 , 2 , 3 , 4 , 5 , 6 \ndengan syarat digit-digit genap tidak \nberdampingan adalah... \n(A) 72 \n(B) 36 \n(C) 144 \n(D) 180 \n(E) 480 \n \n10. Terdapat kubus ABCD.EFGH dengan panjang \nrusuk 4. Titik L terletak pada pertengahan EH. \nTitik K berada pada AG sehingga AK : KG = 1 : 3. \nJarak KL adalah... \n(A) 2√2 \n(B) 3 \n(C) 3√2 \n(D) √11 \n(E) 2√3 \n \n11. Sebuah bangun ruang dibentuk dengan cara \nmenghubungkan dua buah persegi identik yang \nsejajar, namun salah satu persegi diputar sebesar \n45𝑜 terhadap pusatnya. Sisi-sisi tegak bangun ini \ndibentuk oleh segitiga sama kaki yang \nmenghubungkan titik-titik sudut kedua persegi \ntersebut. Bangun ini dikenal sebagai Antiprisma \nSegiempat. \nManakah pernyataan berikut yang benar \nmengenai ciri-ciri bangun ruang tersebut? \n(1) Memiliki 12 rusuk yang sama panjang. \n(2) Memiliki 10 bidang sisi. \n(3) Memiliki jaring-jaring yang terdiri dari 2 \npersegi dan 6 segitiga. \n(4) Memiliki total 8 titik sudut. \n \n(A) (1) , (2) , dan (3) \n(B) (1) dan (3) \n(C) (2) dan (4) \n(D) (4) saja \n(E) Semua pilihan","passage":"","images":["assets/questions/pdf_18_000.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0627","kind":"halaman","subject":"PK","source":"TAMBAHAN4 PK 2026.pdf","page":2,"title":"TAMBAHAN4 PK 2026 · Halaman 2","text":"12. Berikut ini klaim langkah-langkah pembuktian \nbahwa \n52026×142026\n√49×702025 = 10 . \nEkspresi langkah ke-0 : \n52026×142026\n√49×702025  \nEkspresi langkah ke-1 : \n52026×(2×7)2026\n7×(7×10)2025  \nEkspresi langkah ke-2 : \n52026×22026×72026\n72026×102025\n \nEkspresi langkah ke-3 : \n102026×72026\n72026×102025 \nEkspresi langkah ke-4 : 10\n2026\n2025 \nEkspresi langkah ke 5 : 10 \n \nEkspresi pada langkah keberapa sajakah yang \nharus diganti sehingga semua langkah \npembuktiannya benar? \n(1) Langkah ke-1 \n(2) Langkah ke-2 \n(3) Langkah ke-3 \n(4) Langkah ke-4 \n \n(A) (1) , (2) , dan (3) \n(B) (1) dan (3) \n(C) (2) dan (4) \n(D) (4) saja \n(E) Semua pilihan \n \n13. Diketahui tiga bilangan asli x , y , dan z dengan \nFPB(x , y , z) = 4 dan KPK(x , y , z) = 16.  \nBerdasarkan informasi yang diberikan, manakah \nhubungan antara kuantitas P dan Q berikut yang \nbenar ? \nP \nQ \n𝑥−𝑦−𝑧 \n2 \n \n(A) Kuantitas P lebih dari atau sama dengan 2 \nkali kuantitas Q. \n(B) Kuantitas P lebih dari kuantitas Q, tetapi \nkurang dari 2 kali kuantitas Q. \n(C) Kuantitas P sama dengan Kuantitas Q. \n(D) Kuantitas P kurang dari kuantitas Q. \n(E) Tidak dapat ditentukan hubungan antara \nkuantitas P dan Q. \n\n14. Diketahui 𝑎= 252 −5  dan  𝑏= 45 × 35 \nBerdasarkan informasi yang diberikan, manakah \nhubungan antara kuantitas P dan Q berikut yang \nbenar ? \nP \nQ \nFPB( a , b) \nBanyak faktor positif \ndari 45 \n \n(A) Kuantitas P lebih dari atau sama dengan 2 \nkali kuantitas Q. \n(B) Kuantitas P lebih dari kuantitas Q, tetapi \nkurang dari 2 kali kuantitas Q. \n(C) Kuantitas P sama dengan Kuantitas Q. \n(D) Kuantitas P kurang dari kuantitas Q. \n(E) Tidak dapat ditentukan hubungan antara \nkuantitas P dan Q. \n \n15. Untuk bilangan real a tertentu , di antara tiga \nbilangan 𝑎 , 𝑎2 , dan  √|𝑎| , apakah 𝑎 merupakan \nbilangan terkecil ? \nPutuskan apakah pernyataan (1) dan (2) berikut \ncukup untuk menjawab pertanyaan tersebut. \n(1) 𝑎< −2 \n(2) −\n1\n3 < 𝑎< 0 \n \n(A) Pernyataan (1) SAJA cukup untuk menjawab \npertanyaan, tetapi pernyataan (2) SAJA tidak \ncukup. \n(B) Pernyataan (2) SAJA cukup untuk menjawab \npertanyaan, tetapi pernyataan (1) SAJA tidak \ncukup. \n(C) DUA pernyataan BERSAMA-SAMA cukup \nuntuk menjawab pertanyaan, tetapi SATU \nsaja tidak cukup. \n(D) Pernyataan (1) SAJA cukup untuk menjawab \npertanyaan dan pernyataan (2) SAJA cukup. \n(E) Pernyataan (1) dan pernyataan (2) tidak \ncukup untuk menjawab pertanyaan.","passage":"","images":["assets/questions/pdf_18_001.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0628","kind":"slide","subject":"PK","source":"FR DAY 5 UTBK 2026.pptx","page":2,"title":"FR DAY 5 UTBK 2026 · Slide 2","text":"","passage":"","images":["assets/questions/present_19_001_0.webp","assets/questions/present_19_001_1.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0629","kind":"slide","subject":"PK","source":"FR DAY 5 UTBK 2026.pptx","page":3,"title":"FR DAY 5 UTBK 2026 · Slide 3","text":"","passage":"","images":["assets/questions/present_19_002_0.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0630","kind":"slide","subject":"PK","source":"FR DAY 5 UTBK 2026.pptx","page":4,"title":"FR DAY 5 UTBK 2026 · Slide 4","text":"","passage":"","images":["assets/questions/present_19_003_0.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0631","kind":"slide","subject":"PK","source":"FR DAY 5 UTBK 2026.pptx","page":5,"title":"FR DAY 5 UTBK 2026 · Slide 5","text":"","passage":"","images":["assets/questions/present_19_004_0.webp","assets/questions/present_19_004_1.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0632","kind":"slide","subject":"PK","source":"FR DAY 5 UTBK 2026.pptx","page":6,"title":"FR DAY 5 UTBK 2026 · Slide 6","text":"","passage":"","images":["assets/questions/present_19_005_0.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0633","kind":"slide","subject":"PK","source":"FR DAY 5 UTBK 2026.pptx","page":7,"title":"FR DAY 5 UTBK 2026 · Slide 7","text":"","passage":"","images":["assets/questions/present_19_006_0.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0634","kind":"slide","subject":"PK","source":"FR DAY 5 UTBK 2026.pptx","page":8,"title":"FR DAY 5 UTBK 2026 · Slide 8","text":"","passage":"","images":["assets/questions/present_19_007_0.webp"],"options":[],"answer":null,"explanation":""},{"id":"q0635","kind":"slide","subject":"PK","source":"FR DAY 5 UTBK 2026.pptx","page":9,"title":"FR DAY 5 UTBK 2026 · Slide 9","text":"","p  T('lbi-kritis','LBI','Membaca Kritis','Menengah',25,'Bedakan informasi yang dinyatakan langsung dan simpulan yang masih perlu dukungan bukti.','Temukan klaim penulis, alasan pendukung, dan keterbatasan data. Jangan menganggap korelasi sebagai sebab akibat.','Jika penggunaan sepeda dan kebugaran meningkat bersamaan, data itu belum membuktikan sepeda satu-satunya penyebab.','Klaim + bukti + alasan','argument','Dua variabel meningkat bersamaan. Apa simpulan paling aman?',['Pasti saling menyebabkan','Tidak berkaitan sama sekali','Ada hubungan yang perlu diuji lebih lanjut','Salah satu harus turun'],2,'Korelasi tidak cukup untuk membuktikan hubungan sebab akibat.'),

 T('lbi-argumen','LBI','Fakta, Opini, dan Argumen','Menengah',22,'Identifikasi pernyataan yang bisa diuji dan penilaian yang membutuhkan alasan.','Fakta dapat diverifikasi. Opini berupa penilaian, sedangkan argumen mengaitkan klaim dengan bukti.','“Suhu mencapai 30°C” dapat diuji. “Cuacanya paling nyaman” bersifat subjektif.','Klaim → alasan → bukti','argument','Manakah yang dapat diuji sebagai fakta?',['Makanan itu sangat enak','Kota ini terbaik','Perpustakaan buka pukul 08.00','Pelajaran ini mudah'],2,'Jam buka dapat diperiksa melalui informasi operasional.'),

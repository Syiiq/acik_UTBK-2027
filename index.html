return `<div style="margin-top:23px"><span class="eyebrow">PILIH JAWABAN</span><h3 style="font-size:15px;margin:7px 0 15px">Pilih jawaban paling tepat</h3>${q.options.map((o,i)=>{let L='ABCDE'[i];return `<button class="choice ${selected===L?'selected':''} ${feedback&&q.answer===L?'right':''} ${feedback&&selected===L&&q.answer&&q.answer!==L?'wrong':''}" data-action="choice" data-val="${L}"><span class="letter">${L}</span><span class="choice-text">${esc(o)}</span></button>`}).join('')}<div class="answer-actions"><button class="btn primary" data-action="check" ${!selected?'disabled':''}>${q.answer?'Periksa jawaban':'Analisis pilihan dengan AI'} ↗</button><button class="btn outline" data-action="reveal">Lihat jawaban ↗</button><button class="btn outline" data-action="ask-focus">✦ Tanya tutor</button></div>${feedback||''}</div>`}
function questionText(q){const str=(q.text||'').trim();return str?`<div class="text-question"><div class="text-head"><span class="eyebrow">TEKS SOAL · BISA DISELEKSI & DISALIN</span><button class="btn xs outline" data-action="copy-text">Salin teks ↗</button></div><p class="question-stem selectable">${esc(str)}</p></div>`:''}
function renderFocus(){const q=currentQ();if(!q)return '<div class="empty">Soal tidak ditemukan.</div>';const idx=questions.findIndex(o=>o.id===q.id);const done=!!state.done[q.id],canText=!!q.text?.trim();const isFigure=!canText&&q.images.length>0;const images=q.images.length?`<details class="original-source" ${isFigure?'open':''}><summary>${isFigure?'Lihat gambar asli soal':'Lihat referensi gambar atau diagram asli jika diperlukan'}</summary><div class="images-gallery">${q.images.map(x=>`<img src="${esc(x)}" alt="Referensi visual dari ${esc(q.source)}" loading="lazy">`).join('')}</div></details>`:'';
return `<div class="pagehead"><div><span class="eyebrow">FOCUS MODE / ${q.subject}</span><h1>Ruang Latihan</h1><p>Jawab langsung menggunakan teks. Kamu tidak perlu mengetik atau mengunggah gambar.</p></div><button class="btn ghost" data-action="go" data-page="bank">← Bank soal</button></div><div class="focus-layout"><section class="panel focus-main"><div class="focus-header"><div>${mini(q.subject)} ${mini(canText?'Teks siap disalin':'Sumber visual')}<h2 class="focus-title">${esc(q.title)}</h2></div><button class="btn xs ${done?'primary':'outline'}" data-action="mark" data-id="${q.id}">${done?'✓ Selesai':'✓ Tandai selesai'}</button></div><div class="focus-body">${q.passage?`<div><span class="eyebrow">TEKS ACUAN</span><div class="passage selectable">${esc(q.passage)}</div></div>`:''}${questionText(q)}${isFigure?`<div class="note"><strong>Gambar belum menjadi teks.</strong><p>Klik tombol di bawah untuk menyalin isi gambar menjadi soal teks secara otomatis melalui AI. Tidak perlu mengunggah gambar satu per satu.</p><button class="btn primary" data-action="transcribe-one">✦ Ubah gambar ini menjadi teks</button><small id="transcribeStatus" style="display:block;margin-top:8px"></small></div>`:''}${images}${q.kind==='halaman'?'<div class="note">Ini adalah tampilan halaman sumber. Buka tab Soal Teks di bank soal untuk memilih pertanyaan satu per satu dari PDF yang sama.</div>':qoptions(q)}${!canText&&q.kind==='slide'&&!q.images.length?'<div class="note">Slide ini tidak memuat teks pertanyaan yang terbaca.</div>':''}<div class="answer-actions" style="justify-content:space-between;margin-top:30px"><button class="btn outline" data-action="focus" data-id="${questions[Math.max(0,idx-1)].id}" ${idx===0?'disabled':''}>← Sebelumnya</button><button class="btn outline" data-action="focus" data-id="${questions[Math.min(questions.length-1,idx+1)].id}" ${idx===questions.length-1?'disabled':''}>Berikutnya →</button></div></div></section><aside class="focus-aside"><div class="panel asidebox"><span class="eyebrow">SUMBER SOAL</span><h3>${q.kind==='slide'?'PowerPoint':q.kind==='teks'||q.kind==='halaman'?'Dokumen PDF':'Dokumen Word'}</h3><p class="sourcefile">${esc(q.source)}</p><div class="source-tags">${mini(q.answer?'Kunci terverifikasi':'Belum ada kunci terverifikasi',q.answer?'green':'gold')} ${mini(q.page)}</div><p>${q.answer?'Kamu bisa melihat kunci dan pembahasan langsung.':'Jika belum ada kunci sumber, tutor AI dapat membantu menyelesaikan soal, tetapi hasil AI bukan kunci resmi.'}</p></div><div class="panel asidebox"><h3>✦ Tanya ACIK</h3><p>Bisa bertanya kenapa salah, rumus yang digunakan, dan bagaimana mendapatkan jawaban.</p><button class="btn primary" style="width:100%" data-action="ask-focus">Bahas dengan ACIK AI ↗</button></div></aside></div>`}
function renderVisual(){const labs=[['graph','∿','Grafik Fungsi Kuadrat','Ubah koefisien a, b, c dan amati parabola.'],['venn','◉','Diagram Venn','Visualisasikan gabungan dan irisan himpunan.'],['coin','◍','Simulasi Peluang','Lakukan percobaan koin secara acak.'],['stats','▥','Statistika Interaktif','Ubah data, lalu lihat rata-rata dan median.'],['logic','⇢','Logika Implikasi','Eksplorasi tabel kebenaran P → Q.'],['triangle','△','Luas Segitiga','Ubah alas dan tinggi segitiga.']];const v=labs.find(x=>x[0]===currentViz)||labs[0];return `<div class="pagehead"><div><span class="eyebrow">INTERACTIVE LEARNING / VISUAL STUDIO</span><h1>Visual Lab</h1><p>Bermain dengan angka dan parameter untuk memahami konsep secara langsung.</p></div><button class="btn outline" data-action="go" data-page="bank">Lanjut latihan soal ↗</button></div><div class="visualgrid" style="margin-bottom:25px">${labs.map(l=>`<button class="vizcard" data-action="viz" data-viz="${l[0]}" style="${currentViz===l[0]?'border-color:#6ea7ff;background:linear-gradient(135deg,#143d80,#122348)':''}"><span class="vico">${l[1]}</span><strong>${l[2]}</strong><span>${l[3]}</span></button>`).join('')}</div><div class="sectionhead"><div><h2>${v[2]}</h2><p>${v[3]}</p></div></div><div class="simlayout"><div class="panel pad"><div class="visframe" id="vizStage">${vizStage()}</div><div class="simreadout" id="vizInfo">Silakan ubah parameter untuk melihat hasil.</div></div><aside class="panel pad"><span class="eyebrow">CONTROL CENTER</span><h3 style="font-size:19px;margin:8px 0 12px">Atur eksperimen</h3><p class="muted" style="font-size:12px">Seluruh hasil akan langsung diperbarui ketika nilai berubah.</p><div id="vizControls" class="simcontrols">${vizControls()}</div><div class="note" style="margin-top:24px">Visualisasi ini merupakan media latihan konsep. Ia bukan salinan gambar dari dokumen yang diunggah.</div></aside></div>`}
function vizStage(){if(currentViz==='graph')return '<canvas id="graphCanvas" width="820" height="440" aria-label="Grafik parabola"></canvas>';if(currentViz==='venn')return `<div class="simui"><svg viewBox="0 0 560 300" width="100%"><rect x="2" y="2" width="556" height="296" fill="#0d2146" rx="12" stroke="#355a95"/><circle cx="224" cy="150" r="115" fill="#3368fa" fill-opacity=".36" stroke="#79aeff" stroke-width="2.5"/><circle cx="336" cy="150" r="115" fill="#0dc6c1" fill-opacity=".3" stroke="#62f6e0" stroke-width="2.5"/><text x="165" y="53" fill="#c7e0ff" font-size="18">A</text><text x="385" y="53" fill="#b5fff0" font-size="18">B</text><text id="vennOnlyA" x="172" y="164" fill="white" font-size="32" text-anchor="middle" font-weight="700"></text><text id="vennCross" x="280" y="164" fill="white" font-size="32" text-anchor="middle" font-weight="700"></text><text id="vennOnlyB" x="391" y="164" fill="white" font-size="32" text-anchor="middle" font-weight="700"></text></svg></div>`;if(currentViz==='coin')return `<div class="tossbar"><div class="tossstat"><div style="font-size:26px">◉</div><strong id="heads">0</strong><small>Kepala</small></div><div class="tossstat"><div style="font-size:26px">○</div><strong id="tails">0</strong><small>Ekor</small></div></div><div class="progressbar" style="height:17px;margin:20px"><div id="coinBar" style="width:50%"></div></div>`;if(currentViz==='stats')return '<div id="statsBars" style="height:300px;display:flex;align-items:end;justify-content:center;gap:16px;padding:15px"></div>';if(currentViz==='logic')return `<div class="simui"><table style="width:85%;border-collapse:collapse;text-align:center"><thead><tr><th style="padding:14px">P</th><th>Q</th><th>P → Q</th></tr></thead><tbody id="logicRows"></tbody></table></div>`;return `<div class="simui"><svg viewBox="0 0 560 280" width="100%"><polygon id="triPolygon" fill="#3962cc99" stroke="#7cd6ff" stroke-width="3" points="155,230 405,230 280,42"/><path id="triHeight" stroke="#ffd38a" stroke-dasharray="7 7" stroke-width="2" d="M280 42V230"/><text id="triLabelA" x="280" y="263" fill="#b6dcff" text-anchor="middle" font-size="17"></text><text id="triLabelH" x="292" y="140" fill="#ffdcaa" font-size="17"></text></svg></div>`}
function slider(id,label,min,max,val,step=1){return `<div class="inputgroup"><label>${label}<output id="${id}O">${val}</output></label><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${val}" data-action="viz-input"></div>`}
function vizControls(){switch(currentViz){case 'graph':return slider('coefA','Koefisien a',-3,3,1,.5)+slider('coefB','Koefisien b',-8,8,0,.5)+slider('coefC','Koefisien c',-8,8,-4,.5);case 'venn':return slider('setA','Anggota A',3,30,12)+slider('setB','Anggota B',3,30,9)+slider('inter','Irisan',0,9,4);case 'coin':return `<button class="btn primary" style="width:100%;margin:8px 0" data-action="toss" data-qty="1">Lempar 1 kali</button><button class="btn outline" style="width:100%;margin:8px 0" data-action="toss" data-qty="10">Lempar 10 kali</button><button class="btn outline" style="width:100%;margin:8px 0" data-action="toss" data-qty="100">Lempar 100 kali</button><button class="btn ghost" style="width:100%;margin:8px 0" data-action="coin-reset">Reset</button>`;case 'stats':return slider('d1','Data 1',0,20,4)+slider('d2','Data 2',0,20,6)+slider('d3','Data 3',0,20,8);case 'logic':return `<div class="inputgroup"><label>P</label><select class="select" id="logicP" data-action="viz-input"><option value="1">Benar</option><option value="0">Salah</option></select></div><div class="inputgroup"><label>Q</label><select class="select" id="logicQ" data-action="viz-input"><option value="1">Benar</option><option value="0">Salah</option></select></div>`;default:return slider('base','Alas segitiga',2,16,8)+slider('height','Tinggi segitiga',2,12,5)}}
function updateViz(){let el=document.getElementById('vizInfo');if(!el)return;let get=id=>Number(document.getElementById(id)?.value||0);document.querySelectorAll('[data-action="viz-input"]').forEach(x=>{let o=document.getElementById(x.id+'O');if(o)o.textContent=x.value});if(currentViz==='graph'){let a=get('coefA'),b=get('coefB'),c=get('coefC'),canvas=document.getElementById('graphCanvas');if(!canvas)return;const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#0d2044';ctx.fillRect(0,0,w,h);let X=x=>w/2+x*w/22,Y=y=>h/2-y*h/22;for(let k=-10;k<=10;k++){ctx.strokeStyle='#284670';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(X(k),0);ctx.lineTo(X(k),h);ctx.moveTo(0,Y(k));ctx.lineTo(w,Y(k));ctx.stroke()}ctx.strokeStyle='#a4bfe6';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,Y(0));ctx.lineTo(w,Y(0));ctx.moveTo(X(0),0);ctx.lineTo(X(0),h);ctx.stroke();ctx.strokeStyle='#59ceff';ctx.lineWidth=4;ctx.shadowColor='#257cfc';ctx.shadowBlur=16;ctx.beginPath();for(let px=0;px<=w;px+=2){let x=(px-w/2)/(w/22),y=a*x*x+b*x+c;px===0?ctx.moveTo(px,Y(y)):ctx.lineTo(px,Y(y))}ctx.stroke();ctx.shadowBlur=0;const v=a!==0?(-b/(2*a)).toFixed(2):null;el.innerHTML=`<strong>y = ${a}x² ${b>=0?'+':''}${b}x ${c>=0?'+':''}${c}</strong><br>${a===0?'Grafik linear karena a = 0.':`Parabola membuka ke ${a>0?'atas':'bawah'}. Titik puncak x = ${v}.`} Nilai potong sumbu Y adalah ${c}.`}
else if(currentViz==='venn'){let A=get('setA'),B=get('setB'),i=Math.min(get('inter'),A,B);document.getElementById('inter').max=Math.min(A,B);if(get('inter')!==i)document.getElementById('inter').value=i;document.getElementById('interO').textContent=i;document.getElementById('vennOnlyA').textContent=A-i;document.getElementById('vennOnlyB').textContent=B-i;document.getElementById('vennCross').textContent=i;el.innerHTML=`<strong>|A ∪ B| = ${A} + ${B} − ${i} = ${A+B-i}</strong><br>Irisan dihitung sekali agar tidak terjadi penghitungan ganda.`}
else if(currentViz==='coin'){const all=coinHeads+coinTails,rate=all?Math.round(coinHeads/all*100):50;document.getElementById('heads').textContent=coinHeads;document.getElementById('tails').textContent=coinTails;document.getElementById('coinBar').style.width=rate+'%';el.innerHTML=`<strong>${all} percobaan, hasil kepala ${all?rate+'%':'belum tersedia'}.</strong><br>Peluang teoretis koin adil = 50%. Frekuensi relatif dapat berubah pada jumlah percobaan kecil.`}
else if(currentViz==='stats'){let a=[get('d1'),get('d2'),get('d3')],sorted=[...a].sort((a,b)=>a-b);document.getElementById('statsBars').innerHTML=a.map((x,i)=>`<div style="width:22%;display:flex;flex-direction:column;align-items:center;gap:10px;color:#b8d7ff;font-size:11px"><b>${x}</b><div style="width:100%;height:${Math.max(3,x/20*225)}px;background:linear-gradient(0deg,#255bdf,#5fe2ff);border-radius:7px 7px 0 0"></div><span>Data ${i+1}</span></div>`).join('');el.innerHTML=`<strong>Rata-rata = ${(a.reduce((x,y)=>x+y,0)/3).toFixed(2)}, median = ${sorted[1]}.</strong><br>Rata-rata peka terhadap nilai ekstrem, sementara median menunjukkan nilai tengah setelah data diurutkan.`}
else if(currentViz==='logic'){const p=get('logicP')===1,q=get('logicQ')===1;document.getElementById('logicRows').innerHTML=[[1,1],[1,0],[0,1],[0,0]].map(([x,y])=>`<tr style="border-top:1px solid #2c456b;${x===+p&&y===+q?'background:#214886':''}"><td style="padding:17px">${x?'B':'S'}</td><td>${y?'B':'S'}</td><td style="color:${!x||y?'#7df1c5':'#ff9eaf'}">${!x||y?'BENAR':'SALAH'}</td></tr>`).join('');el.innerHTML=`<strong>P → Q ${!p||q?'benar':'salah'}.</strong><br>Implikasi hanya salah saat premis P benar, tetapi konsekuensi Q salah.`}
else {let b=get('base'),h=get('height');document.getElementById('triPolygon').setAttribute('points',`${280-b*16} 230 ${280+b*16} 230 280 ${230-h*16}`);document.getElementById('triHeight').setAttribute('d',`M280 ${230-h*16}V230`);document.getElementById('triLabelA').textContent='Alas = '+b+' cm';document.getElementById('triLabelH').textContent='t = '+h+' cm';el.innerHTML=`<strong>Luas = ½ × ${b} × ${h} = ${(b*h/2).toFixed(1)} cm².</strong><br>Segitiga memiliki luas setengah persegi panjang dengan alas dan tinggi sama.`}}
function renderProgress(){let visited=Object.keys(state.visits).length,done=Object.keys(state.done).filter(x=>state.done[x]).length,bySub=Object.keys(subjects).filter(x=>x!=='CAMPURAN').map(s=>{let ar=questions.filter(q=>q.subject===s);let count=ar.filter(q=>state.visits[q.id]).length;return [s,count,ar.length]});return `<div class="pagehead"><div><span class="eyebrow">YOUR GROWTH / LEARNING ANALYTICS</span><h1>Progres Belajar</h1><p>Aktivitas disimpan pada browser ini. Bukan data tryout resmi.</p></div><button class="btn outline" data-action="export">Ekspor progres ↓</button></div><div class="statgrid" style="margin:0 0 25px">${stat('Unit dibuka',visited,'Sumber unik yang sudah dilihat','◈')}${stat('Selesai ditandai',done,'Unit diselesaikan manual','✓')}${stat('Jawaban diperiksa',state.attempts.length,'Hanya yang memiliki kunci','▦')}${stat('Jawaban benar',state.attempts.filter(x=>x.correct).length,'Berdasarkan kunci sumber','✦')}</div><div class="trackergrid"><div class="panel pad"><span class="eyebrow">PROGRESS BY SUBJECT</span><h3 style="margin:7px 0 23px;font-size:19px">Cakupan belajar per subtes</h3><div class="barlist">${bySub.map(([s,c,n])=>`<div class="barrow"><span>${s} · ${sy(s).slice(0,20)}</span><div class="progressbar"><div style="width:${n?c/n*100:0}%;background:${COLOR[s]}"></div></div><strong>${n?Math.round(c/n*100):0}%</strong></div>`).join('')}</div><p class="smallinfo" style="margin-top:25px">Cakupan menghitung unit soal, slide, dan halaman yang pernah dibuka, bukan skor kompetensi.</p></div><div class="panel pad"><span class="eyebrow">RECENT ACTIVITY</span><h3 style="margin:7px 0 18px;font-size:19px">Terakhir dipelajari</h3><div class="activity">${recent().map(h=>{let q=qget(h.id);return q?`<button class="sourceitem" data-action="focus" data-id="${q.id}"><span class="fileico">↗</span><span style="overflow:hidden"><strong>${esc(q.title)}</strong><small>${sy(q.subject)}</small></span></button>`:''}).join('')||'<div class="note">Belum ada aktivitas. Mulai buka bank soal untuk melacak progresmu.</div>'}</div></div></div><div class="panel pad" style="margin-top:17px"><span class="eyebrow">MATERI BELAJAR</span><h3 style="margin:8px 0">Progres ${BUILTIN.length} modul konsep</h3><div class="barlist">${Object.keys(subjects).filter(x=>x!=='CAMPURAN').map(s=>{let ls=BUILTIN.filter(l=>l.subject===s),steps=ls.reduce((t,l)=>t+Object.values(state.lessonChecks?.[l.id]||{}).filter(Boolean).length,0);return `<div class="barrow"><span>${s}</span><div class="progressbar"><div style="width:${ls.length?steps/(ls.length*3)*100:0}%;background:${COLOR[s]}"></div></div><strong>${steps}/${ls.length*3}</strong></div>`}).join('')}</div></div><div class="note" style="margin-top:17px">Catatan: Data tersimpan di localStorage browser perangkat ini. Menghapus data browser atau berpindah perangkat bisa menghilangkan progres. Gunakan tombol ekspor untuk membuat salinan.</div>`}
function chatFor(q){chatContext=q?.id||null;go('chat');if(q)toast('Tutor siap membahas '+q.subject+' dari sumber yang dipilih.')}
function renderChat(){let q=qget(chatContext);return `<div class="pagehead"><div><span class="eyebrow">LEARN / ASK / UNDERSTAND</span><h1>ACIK AI Tutor</h1><p>Tanya langkah penyelesaian, alasan jawaban salah, atau konsep yang masih membingungkan.</p></div>${q?`<button class="btn ghost" data-action="focus" data-id="${q.id}">← Kembali ke soal</button>`:''}</div><div class="chatlayout"><div class="panel chatpanel"><div class="chathead"><div class="ai-avatar">✦</div><div><strong>ACIK Study Companion</strong><small>Mode offline tersedia · AI online aktif setelah API dikonfigurasi</small></div></div><div class="messages" id="messages">${(state.messages.length?state.messages:[{role:'assistant',text:'Halo! Aku ACIK, teman belajarmu. Kamu bisa bertanya tentang konsep UTBK, mengapa jawabanmu salah, atau minta langkah penyelesaian. Untuk analisis soal bergambar dan percakapan AI yang mendalam, aktifkan API tutor di Vercel.'}]).map(m=>`<div class="message ${m.role==='user'?'you':''}"><span class="msgavatar">${m.role==='user'?'U':'✦'}</span><div class="bubble">${esc(m.text)}</div></div>`).join('')}</div><form id="chatForm" class="chatcompose"><textarea class="textarea" id="chatInput" rows="2" placeholder="Contoh: kenapa jawabanku B salah? Jelaskan dari dasar..." maxlength="2500" required></textarea><button type="submit" class="btn primary" id="chatSubmit" ${chatBusy?'disabled':''}>Kirim ↗</button></form></div><aside><div class="panel asidebox"><span class="eyebrow">CURRENT CONTEXT</span><h3 style="margin-top:9px">${q?esc(q.title):'Belajar bebas'}</h3><p>${q?esc(q.source):'Buka soal dari Bank Soal, lalu pilih Bahas dengan AI untuk membawa konteks soal dan gambar ke percakapan.'}</p>${q?mini(q.subject):mini('Tanpa konteks')}</div><div class="panel asidebox"><h3>Contoh pertanyaan</h3>${['Kenapa jawaban saya salah?','Jelaskan langkah penyelesaian dari nol.','Konsep atau rumus apa yang dipakai?','Buat soal serupa untuk latihan.'].map(t=>`<button class="suggestion" data-action="prompt" data-prompt="${esc(t)}">✦ ${esc(t)}</button>`).join('')}</div><div class="note chatnote">Tutor offline menggunakan penjelasan terstruktur yang tersedia di website. Tutor AI generatif memakai endpoint <code>/api/tutor</code> di Vercel setelah pemilik website memasang GEMINI_API_KEY. AI dapat keliru; cocokkan dengan materi dan perhitungan.</div></aside></div>`}
function scrollChat(){setTimeout(()=>{let x=document.getElementById('messages');if(x)x.scrollTop=x.scrollHeight},50)}
function offlineAnswer(prompt,q){const t=prompt.toLowerCase();if(q?.answer){const match=state.attempts.filter(x=>x.id===q.id).slice(-1)[0],wrong=match?.choice;let intro=wrong&&wrong!==q.answer?`Jawaban ${wrong} belum tepat menurut kunci sumber. Jawaban yang tersedia adalah ${q.answer}. `:`Berdasarkan kunci yang tersedia, jawaban yang benar adalah ${q.answer}. `;if(t.includes('salah')||t.includes('kenapa')||t.includes('pembahasan')||t.includes('langkah'))return intro+(q.explanation||'Periksa kembali gagasan utama dan hubungan antarunsur soal.')+'\n\nLangkah belajar: (1) Identifikasi apa yang ditanyakan, (2) tandai bukti dalam teks, (3) cocokkan tiap pilihan, (4) eliminasi pilihan yang tidak sesuai.\n\nUntuk dialog lebih detail, hubungkan API tutor di Vercel.';return `Soal ini memiliki kunci ${q.answer}. ${q.explanation}\n\nKamu juga bisa bertanya mengapa opsi lain kurang tepat. Aktifkan tutor online untuk pembahasan bebas.`}if(q){return `Aku sedang melihat ${q.title} dari ${q.source}. ${q.images.length&&!q.text?.trim()?'Soal ini berisi gambar yang belum ditranskripsi. Tutor offline tidak dapat menafsirkan gambarnya. ':''}Belum ada kunci yang dapat diverifikasi dalam sumber ini, jadi aku tidak akan menebak jawaban benar atau salah.\n\nCara mendekati soal: pahami informasi yang diketahui, tentukan pertanyaan yang ingin dijawab, hubungkan dengan rumus atau konsep yang sesuai, lalu periksa setiap opsi.\n\nUntuk jawaban spesifik terhadap gambar atau soal ini, konfigurasikan GEMINI_API_KEY agar tutor AI online aktif.`}if(t.includes('peluang'))return 'Peluang kejadian A = banyak hasil yang memenuhi A ÷ banyak seluruh hasil yang mungkin. Misalnya pada dadu adil, peluang angka genap = 3/6 = 1/2. Coba Visual Lab → Simulasi Peluang untuk melihat percobaannya.';if(t.includes('kuadrat')||t.includes('fungsi'))return 'Untuk y = ax² + bx + c: a mengatur arah buka, c adalah perpotongan sumbu Y, dan x titik puncak = −b/(2a) jika a ≠ 0. Lihat Visual Lab → Grafik Fungsi Kuadrat dan geser nilainya.';if(t.includes('logika')||t.includes('implikasi'))return 'P → Q bernilai salah hanya jika P benar dan Q salah. Empat kombinasi nilai kebenaran bisa kamu coba di Visual Lab → Logika Implikasi.';return 'Aku bisa membantumu mulai dari konsep dasar. Untuk jawaban kontekstual atau percakapan bebas, tutor AI perlu diaktifkan di Vercel. Kamu juga bisa membuka salah satu soal terlebih dahulu, lalu klik “Bahas dengan tutor AI” agar konteksnya terbawa.'}
async function imagePayload(q){if(!q?.images?.length)return null;try{const r=await fetch(q.images[0]);const blob=await r.blob();if(blob.size>850000)return null;const buf=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob)});return buf}catch{return null}}
async function sendChat(value){const text=value.trim();if(!text||chatBusy)return;const q=qget(chatContext);state.messages.push({role:'user',text});save();chatBusy=true;render();const hist=state.messages.slice(-8);let reply='';try{const image=await imagePayload(q);const res=await fetch('/api/tutor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:hist,context:q?{title:q.title,source:q.source,subject:q.subject,text:q.text.slice(0,6000),passage:q.passage.slice(0,4000),options:q.options,answer:q.answer,explanation:q.explanation,selected:state.attempts.filter(a=>a.id===q.id).slice(-1)[0]?.choice||selected,image}:null})});if(!res.ok)throw Error((await res.json().catch(()=>({}))).error||'Tutor online belum tersedia');const json=await res.json();if(!json.reply)throw Error('Respons AI kosong');reply=json.reply}catch(e){reply=offlineAnswer(text,q);if(!state.aiInfoSeen){reply+='\n\n[Mode bantuan offline. Tutor AI online belum terhubung. Atur GEMINI_API_KEY di Vercel untuk mengaktifkannya.]';state.aiInfoSeen=true}}state.messages.push({role:'assistant',text:reply});state.messages=state.messages.slice(-60);chatBusy=false;save();if(page==='chat'){render();scrollChat()}}
function checkAnswer(){let q=currentQ();if(!q||!selected)return;const isKnown=!!q.answer,ok=isKnown?selected===q.answer:null;state.attempts.push({id:q.id,choice:selected,correct:ok,date:date()});state.attempts=state.attempts.slice(-500);save();if(ok===true){feedback=`<div class="feedback success"><strong>✓ Jawaban tepat!</strong><div>${esc(q.explanation)}</div><button style="margin-top:10px" class="btn xs outline" data-action="ask-focus">Tanya lebih lanjut ↗</button></div>`;toast('Jawaban benar, lanjut review.')}else if(ok===false){feedback=`<div class="feedback warn"><strong>Belum tepat. Kunci dari sumber: ${q.answer}.</strong><div>${esc(q.explanation)}</div><button style="margin-top:10px" class="btn xs primary" data-action="ask-focus">✦ Kenapa salah? Tanya AI</button></div>`;toast('Coba lihat pembahasan dan tanya ACIK AI.')}else{feedback=`<div class="feedback"><strong>Pilihan ${selected} disimpan.</strong><div>Kunci jawaban eksplisit belum tersedia pada dokumen ini, jadi pilihanmu belum dapat dinilai benar atau salah. Gunakan AI online untuk diskusi lebih rinci.</div><button class="btn xs primary" style="margin-top:10px" data-action="ask-focus">✦ Bahas dengan AI</button></div>`;toast('Pilihan tersimpan tanpa penilaian otomatis.');chatFor(q);sendChat(`Saya memilih jawaban ${selected}. Tolong periksa apakah jawaban itu benar atau salah berdasarkan soal dan gambar yang dilampirkan. Jelaskan langkah penyelesaian dan alasan pilihan yang lain.`);return}document.getElementById('page').innerHTML=renderFocus()}
function exportProgress(){const payload={exported:new Date().toISOString(),project:'ACIK UTBK',data:state};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='acik-utbk-progres.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Data progres berhasil diekspor')}
async function copyCurrentText(){const q=currentQ();if(!q)return;const content=[q.passage||'',q.text||'',...(q.options?.length===5?q.options.map((v,i)=>'ABCDE'[i]+'. '+v):[])].filter(Boolean).join('\n\n');if(!content){toast('Belum ada teks. Jalankan konversi AI terlebih dahulu.');return}try{await navigator.clipboard.writeText(content)}catch{const ta=document.createElement('textarea');ta.value=content;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}toast('Teks soal sudah disalin.')}
async function toBase64(src){let res=await fetch(src);if(!res.ok)throw Error('Gambar tidak ditemukan');const blob=await res.blob();if(blob.size>1200000)throw Error('Gambar terlalu besar untuk AI');return await new Promise((ok,fail)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=fail;r.readAsDataURL(blob)})}
async function convertOne(q,quiet=false){if(!q?.images?.length)throw Error('Gambar sumber tidak ditemukan');const images=[];for(const path of q.images.slice(0,2))images.push(await toBase64(path));const response=await fetch('/api/extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({images,source:q.source,title:q.title,subject:q.subject})});const result=await response.json().catch(()=>({}));if(response.status===422){state.transcripts[q.id]={skipped:true};save();if(!quiet)toast('Tidak ditemukan teks soal yang jelas pada gambar ini.');return false}if(!response.ok)throw Error(result.error||`Server AI bermasalah (${response.status})`);if(!result?.text?.trim())throw Error('AI tidak berhasil membaca teks dari gambar');state.transcripts[q.id]={text:result.text.trim().slice(0,9000),passage:String(result.passage||'').slice(0,7000),options:Array.isArray(result.options)&&result.options.length===5?result.options.map(String):[],transcriptionNote:String(result.note||'').slice(0,400),answer:null,explanation:''};save();if(!quiet){toast('Transkripsi berhasil. Teks dapat disalin.');render()}return true}
async function transcribeCurrent(){const btn=document.querySelector('[data-action="transcribe-one"]');const q=currentQ();if(!q)return;if(btn){btn.disabled=true;btn.textContent='Sedang mengubah gambar menjadi teks…'}try{await convertOne(q)}catch(err){const el=document.getElementById('transcribeStatus');if(el)el.textContent=err.message;toast('Konversi gagal: '+err.message)}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function bulkConvert(){if(bulkWorking)return;const remaining=questions.filter(q=>q.images.length&&!q.text.trim()&&!state.transcripts[q.id]);if(!remaining.length){toast('Tidak ada gambar yang belum dikonversi.');return}if(!confirm('Konversi '+remaining.length+' gambar menjadi teks menggunakan Gemini API. Proses berjalan otomatis satu per satu, dapat memakan waktu dan menggunakan kuota API. Lanjutkan?'))return;bulkWorking=true;bulkStop=false;bulkCompleted=0;bulkTotal=remaining.length;bulkError='';render();for(const q of remaining){if(bulkStop)break;try{await convertOne(q,true);bulkCompleted++}catch(e){bulkError='Konversi dihentikan pada '+q.title+': '+e.message+'. Pastikan GEMINI_API_KEY aktif dan kuota tersedia. Klik kembali untuk melanjutkan dari yang tersimpan.';break}const st=document.getElementById('bulkStatus');if(st)st.textContent=`Selesai ${bulkCompleted}/${bulkTotal} gambar. Progres sudah tersimpan.`;await sleep(1500)}bulkWorking=false;render();toast(bulkError||('Konversi berhenti. Berhasil '+bulkCompleted+' gambar.'))}
function revealAnswer(){const q=currentQ();if(!q)return;if(q.answer){feedback=`<div class="feedback success"><strong>Kunci terverifikasi: ${q.answer}</strong><p>${esc(q.explanation||'Kunci tercantum dalam dokumen sumber. Pembahasan lengkap belum tersedia.')}</p><button class="btn xs outline" data-action="ask-focus">Tanya tutor lebih lanjut</button></div>`;render();return}chatFor(q);sendChat('Tolong selesaikan soal ini secara rinci, tentukan jawaban yang paling tepat, dan jelaskan mengapa. Kunci resmi belum tersedia. Jika gambar atau teks kurang jelas, katakan bagian apa yang tidak terbaca. Bedakan analisis AI dari kunci resmi.');}
function events(e){const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action;if(a==='go')go(btn.dataset.page);else if(a==='lesson'){lessonId=btn.dataset.lesson;go('learn')}else if(a==='lesson-back'){lessonId=null;go('learn')}else if(a==='lesson-filter'){lessonSubject=btn.dataset.subject;lessonId=null;render()}else if(a==='lesson-visual'){currentViz=btn.dataset.viz;go('visual')}else if(a==='lesson-questions'){bankSubject=btn.dataset.subject;bankSource='SEMUA';bankFilter='';go('bank')}else if(a==='lesson-check'){state.lessonChecks=state.lessonChecks||{};let v=state.lessonChecks[btn.dataset.lesson]||{};v[btn.dataset.key]=!v[btn.dataset.key];state.lessonChecks[btn.dataset.lesson]=v;save();render();toast('Progres materi diperbarui')}else if(a==='subject'){bankSubject=btn.dataset.subject;bankSource='SEMUA';bankFilter='';bankMode=questions.some(q=>q.subject===bankSubject&&(q.kind==='teks'||q.kind==='pilihan'))?'teks':'semua';go('bank')}else if(a==='source'){bankSource=btn.dataset.source;bankSubject='SEMUA';bankFilter='';bankMode=questions.some(q=>q.source===bankSource&&(q.kind==='teks'||q.kind==='pilihan'))?'teks':'semua';go('bank')}else if(a==='bank-mode'){bankMode=btn.dataset.mode;bankPage=0;render()}else if(a==='bulk-transcribe')bulkConvert();else if(a==='stop-bulk'){bulkStop=true;toast('Menjeda konversi setelah soal saat ini selesai')}else if(a==='transcribe-one')transcribeCurrent();else if(a==='copy-text')copyCurrentText();else if(a==='reveal')revealAnswer();else if(a==='filter'){bankSubject=btn.dataset.filter;bankPage=0;render()}else if(a==='page-next'){bankPage++;render()}else if(a==='page-prev'){bankPage=Math.max(0,bankPage-1);render()}else if(a==='focus')focus(btn.dataset.id);else if(a==='practice'){let qs=questions.filter(q=>q.answer&&q.options.length===5);if(qs.length)focus(qs[Math.floor(Math.random()*qs.length)].id)}else if(a==='choice'){selected=btn.dataset.val;feedback=null;render()}else if(a==='check')checkAnswer();else if(a==='mark'){state.done[btn.dataset.id]=!state.done[btn.dataset.id];save();render();toast(state.done[btn.dataset.id]?'Selesai ditandai':'Tanda dihapus')}else if(a==='ask-focus')chatFor(currentQ());else if(a==='viz'){currentViz=btn.dataset.viz;render()}else if(a==='toss'){for(let i=0;i<Number(btn.dataset.qty);i++)Math.random()<.5?coinHeads++:coinTails++;updateViz()}else if(a==='coin-reset'){coinHeads=0;coinTails=0;updateViz()}else if(a==='prompt'){document.getElementById('chatInput').value=btn.dataset.prompt;document.getElementById('chatInput').focus()}else if(a==='export')exportProgress()}
document.addEventListener('click',events);
document.addEventListener('input',e=>{if(e.target.id==='bankSearch'){bankFilter=e.target.value;bankPage=0;const pos=e.target.selectionStart;render();const el=document.getElementById('bankSearch');el.focus();el.setSelectionRange(pos,pos)}else if(e.target.id==='globalSearch'){bankFilter=e.target.value;bankPage=0;if(page!=='bank')go('bank');else render();const x=document.getElementById('globalSearch');x.focus();x.setSelectionRange(x.value.length,x.value.length)}else if(e.target.dataset.action==='viz-input')updateViz()});document.addEventListener('change',e=>{if(e.target.id==='bankSource'){bankSource=e.target.value;bankPage=0;if(bankSource!=='SEMUA'&&!questions.some(q=>q.source===bankSource&&(q.kind==='teks'||q.kind==='pilihan')))bankMode='semua';render()}else if(e.target.dataset.action==='viz-input')updateViz()});document.addEventListener('submit',e=>{if(e.target.id==='chatForm'){e.preventDefault();let x=document.getElementById('chatInput');sendChat(x.value)}});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('globalSearch').focus()}if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='chatInput'){e.preventDefault();document.getElementById('chatForm').requestSubmit()}});
document.getElementById('mobileMenu').onclick=()=>{document.getElementById('sidebar').classList.add('mobile-open');document.getElementById('mobileOverlay').classList.add('visible')};document.getElementById('mobileOverlay').onclick=()=>{document.getElementById('sidebar').classList.remove('mobile-open');document.getElementById('mobileOverlay').classList.remove('visible')};
render();
})();
</script></body></html>
